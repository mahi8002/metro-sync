name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - Zach

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nyc-transit-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nyc-transit-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate source and tests
        run: npm run check

      - name: Start server and check health
        shell: bash
        run: |
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done

          cat server.log
          exit 1

