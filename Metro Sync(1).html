    // ================= 新增：Dijkstra 算法实现 =================
    class PriorityQueue {
      constructor() { this.values = []; }
      enqueue(val, priority) {
        this.values.push({ val, priority });
        this.sort();
      }
      dequeue() { return this.values.shift(); }
      sort() { this.values.sort((a, b) => a.priority - b.priority); }
      isEmpty() { return this.values.length === 0; }
    }

    const findShortestPath = (graph, startNode, endNode) => {
      const distances = {};
      const previous = {};
      const pq = new PriorityQueue();
      
      Object.keys(graph).forEach(node => {
        distances[node] = node === startNode ? 0 : Infinity;
        previous[node] = null;
      });
      pq.enqueue(startNode, 0);

      while (!pq.isEmpty()) {
        const { val: current } = pq.dequeue();
        if (current === endNode) break;

        const neighbors = graph[current] || [];
        neighbors.forEach(neighbor => {
          const time = distances[current] + neighbor.time;
          if (time < distances[neighbor.to]) {
            distances[neighbor.to] = time;
            previous[neighbor.to] = { station: current, time: neighbor.time, line: neighbor.line };
            pq.enqueue(neighbor.to, time);
          }
        });
      }

      if (distances[endNode] === Infinity) return null;
      
      const path = [];
      let curr = endNode;
      while (curr !== startNode) {
        if (!previous[curr]) break;
        path.unshift({ station: curr, ...previous[curr] });
        curr = previous[curr].station;
      }
      return { totalTime: distances[endNode], path };
    };

        const totalSegments = seg.path.length - 1;
        const scaledProg = progress * totalSegments;
        const index = Math.min(Math.floor(scaledProg), totalSegments - 1);
        const subProg = scaledProg - index;

        const p1 = seg.path[index];
        const p2 = seg.path[index + 1];

        return {
          x: p1[0] + (p2[0] - p1[0]) * subProg,
          y: p1[1] + (p2[1] - p1[1]) * subProg
        };
      };

      return (
        <div className={`min-h-screen transition-colors duration-200 ${highContrast ? 'bg-black text-yellow-300 font-mono' : 'bg-slate-900 text-slate-100 font-sans'}`}>
          
          {/* Header Navigation with View Switcher */}
          <header className={`border-b ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/90'} backdrop-blur sticky top-0 z-50`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-xl shadow-md ${highContrast ? 'bg-yellow-400 text-black' : 'bg-blue-600 text-white'}`}>
                  MTA
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight flex items-center gap-2">
                    {t.appTitle}
                    <span className="text-xs px-2 py-0.5 rounded font-mono uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30">GTFS Interactive</span>
                  </h1>
                  <p className="text-xs opacity-75">{t.tagline}</p>
                </div>
              </div>

              {/* View Navigation Tabs */}
              <nav className="flex items-center space-x-1 border rounded-lg p-1 border-slate-700 bg-slate-900/80">
                <button
                  onClick={() => setCurrentView('map')}
                  className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${
                    currentView === 'map' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="map" className="w-3.5 h-3.5" />
                  {t.viewMap}
                </button>
                <button
                  onClick={() => setCurrentView('signUp')}
                  className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${
                    currentView === 'signUp' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="user-plus" className="w-3.5 h-3.5" />
                  {t.viewSignUp}
                </button>
                <button
                  onClick={() => setCurrentView('signIn')}
                  className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${
                    currentView === 'signIn' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="log-in" className="w-3.5 h-3.5" />
                  {t.viewSignIn}
                </button>
                <button
                  onClick={() => setCurrentView('profile')}
                  className={`px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition ${
                    currentView === 'profile' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="user" className="w-3.5 h-3.5" />
                  {t.viewProfile}
                </button>
              </nav>

              {/* Utility Tools */}
              <div className="flex items-center space-x-3 text-sm">
                <button 
                  onClick={triggerGtfsRefresh} 
                  className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg border text-xs font-mono transition ${
                    highContrast ? 'border-yellow-400 hover:bg-yellow-400 hover:text-black' : 'border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300'
                  }`}
                >
                  <Icon name="refresh-cw" className={`w-3.5 h-3.5 ${isRefreshing ? 'animate-spin text-blue-400' : ''}`} />
                  <span>{refreshCountdown}s</span>
                </button>

                <div className="flex items-center space-x-1 border rounded-lg p-1 border-slate-700 bg-slate-800/50">
                  <Icon name="globe" className="w-4 h-4 ml-1 opacity-60" />
                  <button onClick={() => setLang('en')} className={`px-2 py-0.5 rounded text-xs font-medium ${lang === 'en' ? 'bg-blue-600 text-white' : 'opacity-70 hover:opacity-100'}`}>EN</button>
                  <button onClick={() => setLang('es')} className={`px-2 py-0.5 rounded text-xs font-medium ${lang === 'es' ? 'bg-blue-600 text-white' : 'opacity-70 hover:opacity-100'}`}>ES</button>
                  <button onClick={() => setLang('zh')} className={`px-2 py-0.5 rounded text-xs font-medium ${lang === 'zh' ? 'bg-blue-600 text-white' : 'opacity-70 hover:opacity-100'}`}>简体</button>
                </div>

                <button
                  onClick={() => setHighContrast(!highContrast)}
                  className={`p-2 rounded-lg border transition ${
                    highContrast ? 'bg-yellow-400 text-black border-yellow-300 font-bold' : 'border-slate-700 bg-slate-800 text-slate-300 hover:text-white'
                  }`}
                  title={t.highContrastToggle}
                >
                  <Icon name={highContrast ? "sun" : "moon"} className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">

            {/* VIEW 1: SIGN-UP PAGE */}
            {currentView === 'signUp' && (
              <div className="max-w-md mx-auto my-8 p-6 rounded-xl border border-slate-800 bg-slate-950/80 shadow-2xl">
                <h2 className="text-xl font-bold mb-1 text-white flex items-center gap-2">
                  <Icon name="user-plus" className="w-5 h-5 text-blue-400" />
                  {t.signUpTitle}
                </h2>
                <p className="text-xs text-slate-400 mb-6">{t.signUpDesc}</p>

                {authMessage.text && (
                  <div className={`p-3 mb-4 rounded text-xs font-semibold ${
                    authMessage.type === 'error' ? 'bg-red-500/20 border border-red-500/40 text-red-300' : 
                    authMessage.type === 'success' ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300' : 
                    'bg-blue-500/20 border border-blue-500/40 text-blue-300'
                  }`}>
                    {authMessage.text}
                  </div>
                )}

                <form onSubmit={handleSignUpSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">{t.usernameLabel}</label>
                    <input 
                      type="text" 
                      required
                      placeholder={t.usernamePlaceholder}
                      value={formUsername}
                      onChange={(e) => setFormUsername(e.target.value)}
                      className="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-medium mb-1">{t.passwordLabel}</label>
                    <input 
                      type="password" 
                      required
                      placeholder="••••••••"
                      value={formPassword}
                      onChange={(e) => setFormPassword(e.target.value)}
                      className="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-medium mb-1">{t.accountStatusLabel}</label>
                    <select
                      value={formStatus}
                      onChange={(e) => setFormStatus(e.target.value)}
                      className="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:outline-none"
                    >
                      <option value="ENABLE">{t.statusActive}</option>
                      <option value="DISABLE">{t.statusDisabled}</option>
                    </select>
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-2.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-bold transition shadow-lg mt-2"
                  >
                    {t.signUpBtn}
                  </button>
                </form>
              </div>
            )}

            {/* VIEW 2: SIGN-IN PAGE */}
            {currentView === 'signIn' && (
              <div className="max-w-md mx-auto my-8 p-6 rounded-xl border border-slate-800 bg-slate-950/80 shadow-2xl">
                <h2 className="text-xl font-bold mb-1 text-white flex items-center gap-2">
                  <Icon name="log-in" className="w-5 h-5 text-blue-400" />
                  {t.signInTitle}
                </h2>
                <p className="text-xs text-slate-400 mb-6">{t.signInDesc}</p>

                {authMessage.text && (
                  <div className={`p-3 mb-4 rounded text-xs font-semibold ${
                    authMessage.type === 'error' ? 'bg-red-500/20 border border-red-500/40 text-red-300' : 
                    authMessage.type === 'success' ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300' : 
                    'bg-blue-500/20 border border-blue-500/40 text-blue-300'
                  }`}>
                    {authMessage.text}
                  </div>
                )}

                <form onSubmit={handleSignInSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">{t.usernameLabel}</label>
                    <input 
                      type="text" 
                      required
                      placeholder={t.usernameLabel}
                      value={formUsername}
                      onChange={(e) => setFormUsername(e.target.value)}
                      className="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-medium mb-1">{t.passwordLabel}</label>
                    <input 
                      type="password" 
                      required
                      placeholder="••••••••"
                      value={formPassword}
                      onChange={(e) => setFormPassword(e.target.value)}
                      className="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:outline-none"
                    />
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-2.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-bold transition shadow-lg mt-2"
                  >
                    {t.signInBtn}
                  </button>
                </form>
              </div>
            )}

            {/* VIEW 4: USER PROFILE & SETTINGS (MULTILINGUAL) */}
            {currentView === 'profile' && (
              <div className="max-w-xl mx-auto my-6 p-6 rounded-xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="user" className="w-5 h-5 text-blue-400" />
                    {t.viewProfile}
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">{t.welcomeBack}, <span className="font-bold text-slate-200">{currentUser.username}</span>!</p>
                </div>

                {authMessage.text && (
                  <div className="p-3 rounded bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold">
                    {authMessage.text}
                  </div>
                )}

                <form onSubmit={handleProfileUpdate} className="space-y-4 text-xs">
                  <div className="p-4 rounded-lg bg-slate-900/80 border border-slate-800 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-slate-300">{t.accountStatusLabel}</span>
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                        currentUser.status === 'ENABLE' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'
                      }`}>
                        {currentUser.status === 'ENABLE' ? t.statusActive : t.statusDisabled}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400">
                      {currentUser.status === 'ENABLE' ? t.accountActiveMsg : t.accountDisabledMsg}
                    </p>
                    <button
                      type="button"
                      onClick={() => setCurrentUser(prev => ({ ...prev, status: prev.status === 'ENABLE' ? 'DISABLE' : 'ENABLE' }))}
                      className="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs transition"
                    >
                      {t.toggleStatusBtn}
                    </button>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-medium mb-1">{t.langPrefLabel}</label>
                    <select
                      value={lang}
                      onChange={(e) => setLang(e.target.value)}
                      className="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:outline-none"
                    >
                      <option value="en">English (EN)</option>
                      <option value="es">Español (ES)</option>
                      <option value="zh">Simplified Chinese (简体中文)</option>
                    </select>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button 
                      type="submit"
                      className="flex-1 py-2.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-bold transition shadow-lg"
                    >
                      {t.saveSettingsBtn}
                    </button>
                    <button 
                      type="button"
                      onClick={handleSignOut}
                      className="px-4 py-2.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition"
                    >
                      {t.signOutBtn}
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* VIEW 3: INTERACTIVE TRANSIT MAP & SERVICE STATUS DASHBOARD */}
            {currentView === 'map' && (
              <>
                {/* Persona Segment Filter */}
                <section className={`p-4 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/60'}`}>
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                      <Icon name="sliders-horizontal" className="w-4 h-4 text-blue-400" />
                      {t.personaHeader}
                    </h2>
                    <span className="text-xs opacity-60">Personalizes Routing, Wayfinding & Accessibility Priority</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <button
                      onClick={() => handlePersonaChange('commuter')}
                      className={`p-3 rounded-lg border text-left transition-all ${
                        activePersona === 'commuter'
                          ? highContrast ? 'border-yellow-400 bg-yellow-400/20 text-yellow-300' : 'border-blue-500 bg-blue-950/40 text-white shadow-lg ring-1 ring-blue-500/50'
                          : highContrast ? 'border-yellow-400/30 text-yellow-400/60' : 'border-slate-800 bg-slate-900/50 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center space-x-2 font-bold text-sm mb-1">
                        <Icon name="zap" className="w-4 h-4 text-amber-400" />
                        <span>{t.personaCommuter}</span>
                      </div>
                      <p className="text-xs opacity-80 leading-relaxed">{t.personaCommuterDesc}</p>
                    </button>

                    <button
                      onClick={() => handlePersonaChange('wheelchair')}
                      className={`p-3 rounded-lg border text-left transition-all ${
                        activePersona === 'wheelchair'
                          ? highContrast ? 'border-yellow-400 bg-yellow-400/20 text-yellow-300' : 'border-blue-500 bg-blue-950/40 text-white shadow-lg ring-1 ring-blue-500/50'
                          : highContrast ? 'border-yellow-400/30 text-yellow-400/60' : 'border-slate-800 bg-slate-900/50 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center space-x-2 font-bold text-sm mb-1">
                        <Icon name="accessibility" className="w-4 h-4 text-emerald-400" />
                        <span>{t.personaWheelchair}</span>
                      </div>
                      <p className="text-xs opacity-80 leading-relaxed">{t.personaWheelchairDesc}</p>
                    </button>

                    <button
                      onClick={() => handlePersonaChange('tourist')}
                      className={`p-3 rounded-lg border text-left transition-all ${
                        activePersona === 'tourist'
                          ? highContrast ? 'border-yellow-400 bg-yellow-400/20 text-yellow-300' : 'border-blue-500 bg-blue-950/40 text-white shadow-lg ring-1 ring-blue-500/50'
                          : highContrast ? 'border-yellow-400/30 text-yellow-400/60' : 'border-slate-800 bg-slate-900/50 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center space-x-2 font-bold text-sm mb-1">
                        <Icon name="compass" className="w-4 h-4 text-purple-400" />
                        <span>{t.personaTourist}</span>
                      </div>
                      <p className="text-xs opacity-80 leading-relaxed">{t.personaTouristDesc}</p>
                    </button>
                  </div>
                </section>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* Route Planner Side Control */}
                  <div className="lg:col-span-5 space-y-4">
                    <div className={`p-5 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                      <h2 className="text-base font-bold mb-4 flex items-center gap-2">
                        <Icon name="navigation" className="w-5 h-5 text-blue-400" />
                        {t.routePlannerTitle}
                      </h2>

                      <div className="space-y-3">
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">{t.originLabel}</label>
                          <select 
                            value={origin} 
                            onChange={(e) => setOrigin(e.target.value)}
                            className={`w-full p-2.5 rounded-lg border text-sm focus:outline-none ${
                              highContrast ? 'bg-black text-yellow-300 border-yellow-400' : 'bg-slate-900 border-slate-700 text-white'
                            }`}
                          >
                            {Object.values(STATIONS_DATA).map(s => (
                              <option key={`orig-${s.id}`} value={s.id}>{s.name} ({s.lines.join(', ')})</option>
                            ))}
                          </select>
                        </div>

                        <div className="flex justify-center">
                          <button 
                            onClick={() => { const temp = origin; setOrigin(destination); setDestination(temp); }}
                            className="p-1.5 rounded-full border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                          >
                            <Icon name="arrow-right-left" className="w-4 h-4" />
                          </button>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">{t.destinationLabel}</label>
                          <select 
                            value={destination} 
                            onChange={(e) => setDestination(e.target.value)}
                            className={`w-full p-2.5 rounded-lg border text-sm focus:outline-none ${
                              highContrast ? 'bg-black text-yellow-300 border-yellow-400' : 'bg-slate-900 border-slate-700 text-white'
                            }`}
                          >
                            {Object.values(STATIONS_DATA).map(s => (
                              <option key={`dest-${s.id}`} value={s.id}>{s.name} ({s.lines.join(', ')})</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="mt-4 pt-3 border-t border-slate-800">
                        <p className="text-xs text-slate-400 mb-2 font-medium">{t.quickLandmarks}</p>
                        <div className="flex flex-wrap gap-1.5">
                          {LANDMARKS.map(lm => (
                            <button
                              key={lm.stationId}
                              onClick={() => setDestination(lm.stationId)}
                              className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${
                                destination === lm.stationId
                                  ? 'bg-blue-600 border-blue-500 text-white'
                                  : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                              }`}
                            >
                              {lang === 'es' ? lm.nameEs : lang === 'zh' ? lm.nameZh : lm.name}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className={`p-4 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                          <Icon name="radio" className="w-4 h-4 text-emerald-400 animate-pulse" />
                          {t.liveArrivals} @ {STATIONS_DATA[origin]?.name}
                        </h3>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        {liveArrivals.map((arr, idx) => (
                          <div key={idx} className="p-2.5 rounded-lg border border-slate-800 bg-slate-900/80 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                              <span className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${LINE_COLORS[arr.line] || 'bg-slate-700'}`}>
                                {arr.line}
                              </span>
                              <div className="truncate max-w-[90px]">
                                <p className="text-[11px] font-medium text-slate-200 truncate">{arr.destination}</p>
                                <p className="text-[9px] text-slate-400">{arr.status}</p>
                              </div>
                            </div>
                            <span className="font-mono text-sm font-bold text-emerald-400">{arr.minutes}m</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {routeResults && (
                      <div className="space-y-3">
                        {routeResults.map((opt) => {
                          const isSelected = selectedRouteOption === opt.id;
                          return (
                            <div
                              key={opt.id}
                              onClick={() => setSelectedRouteOption(opt.id)}
                              className={`p-4 rounded-xl border cursor-pointer transition-all ${
                                isSelected
                                  ? highContrast ? 'border-yellow-400 bg-yellow-400/20' : 'border-blue-500 bg-blue-950/30 ring-1 ring-blue-500'
                                  : highContrast ? 'border-yellow-400/30' : 'border-slate-800 bg-slate-900/40 hover:border-slate-700'
                              }`}
                            >
                              <div className="flex items-start justify-between mb-2">
                                <div>
                                  <h3 className="font-bold text-sm flex items-center gap-2">
                                    {opt.title}
                                    {opt.isAda && (
                                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
                                        <Icon name="accessibility" className="w-3 h-3" /> ADA
                                      </span>
                                    )}
                                  </h3>
                                  <p className="text-xs opacity-75 mt-0.5 flex items-center gap-3">
                                    <span className="flex items-center gap-1"><Icon name="clock" className="w-3 h-3" /> {opt.duration} {t.durationMinutes}</span>
                                    <span>•</span>
                                    <span>{opt.transfers} {t.transfers}</span>
                                  </p>
                                </div>
                                
                                <div className="flex items-center space-x-1">
                                  {opt.lines.map((line, idx) => (
                                    <span 
                                      key={idx} 
                                      className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shadow ${LINE_COLORS[line] || 'bg-slate-700 text-white'}`}
                                    >
                                      {line}
                                    </span>
                                  ))}
                                </div>
                              </div>

                              {isSelected && (
                                <div className="mt-3 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
                                  {opt.steps.map((step, sIdx) => (
                                    <div key={sIdx} className="flex items-start space-x-2 opacity-90">
                                      <Icon name="chevron-right" className="w-3.5 h-3.5 text-blue-400 shrink-0 mt-0.5" />
                                      <span>{step}</span>
                                    </div>
                                  ))}

                                  <div className="pt-2 flex items-center justify-between">
                                    <button
                                      onClick={(e) => { e.stopPropagation(); saveCurrentRoute(opt); }}
                                      className="px-3 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs flex items-center gap-1 transition"
                                    >
                                      <Icon name="bookmark" className="w-3.5 h-3.5" />
                                      {t.saveRouteBtn}
                                    </button>
                                    <span className="text-[10px] text-slate-400">GTFS Path Validated</span>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  {/* Interactive Vector Map OR Alternate Map Option View (Spec Requirement) */}
                  <div className="lg:col-span-7">
                    <div className={`p-4 rounded-xl border h-full flex flex-col ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                      <div className="flex flex-wrap items-center justify-between mb-3 gap-2">
                        <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                          <Icon name="map" className="w-4 h-4 text-blue-400" />
                          {useAltMap ? t.alternateMapTitle : t.interactiveMapTitle}
                        </h2>

                        <div className="flex items-center space-x-2 text-xs">
                          {/* Map Alternative Fallback Toggle */}
                          <button 
                            onClick={() => setUseAltMap(!useAltMap)}
                            className="px-2.5 py-1 rounded-lg border text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700 transition"
                          >
                            {t.toggleAltMap}
                          </button>
                        </div>
                      </div>

                      {/* Main Interactive Map View OR Text Alternate View */}
                      {!useAltMap ? (
                        <div className="relative flex-1 min-h-[460px] bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
                          {mapLoading && (
                            <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-20">
                              <span className="text-amber-400 animate-pulse text-sm">Loading Real MTA Map Data...</span>
                            </div>
                          )}
                          <div ref={mapContainerRef} className="w-full h-full min-h-[460px] z-10" />
                        </div>
                      ) : (
                        /* Alternate Map View (Text-Based List for Accessibility / Tunnel Use) */
                        <div className="flex-1 min-h-[460px] bg-slate-900 rounded-lg border border-slate-800 p-4 space-y-3 overflow-y-auto">
                          <p className="text-xs text-slate-400 mb-2">High-accessibility text view for screen readers & low-bandwidth tunnel connections:</p>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {Object.values(STATIONS_DATA).map(st => (
                              <div key={st.id} className="p-3 rounded-lg border border-slate-800 bg-slate-950/60 flex items-center justify-between">
                                <div>
                                  <h4 className="font-bold text-sm text-white">{st.name}</h4>
                                  <div className="flex items-center space-x-1 mt-1">
                                    {st.lines.map(l => (
                                      <span key={l} className={`w-4 h-4 rounded-full flex items-center justify-center font-bold text-[9px] ${LINE_COLORS[l]}`}>{l}</span>
                                    ))}
                                    <span className="text-[10px] text-slate-400 ml-1">• {st.borough}</span>
                                  </div>
                                </div>
                                <div className="flex flex-col items-end gap-1">
                                  <button onClick={() => setOrigin(st.id)} className="px-2 py-0.5 rounded bg-blue-600/80 hover:bg-blue-600 text-white text-[10px] font-bold">
                                    Origin
                                  </button>
                                  <button onClick={() => setDestination(st.id)} className="px-2 py-0.5 rounded bg-emerald-600/80 hover:bg-emerald-600 text-white text-[10px] font-bold">
                                    Dest
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* Realtime Alert & Outage Streams */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className={`p-5 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <Icon name="shield-alert" className="w-4 h-4 text-amber-400" />
                        {t.gtfsFeedTitle}
                      </h2>

                      <div className="flex space-x-1 overflow-x-auto max-w-[200px]">
                        <button 
                          onClick={() => setFilterLine('ALL')}
                          className={`px-2 py-0.5 rounded text-[10px] font-bold ${filterLine === 'ALL' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                        >
                          ALL
                        </button>
                        {['1','2','A','N','7'].map(l => (
                          <button
                            key={l}
                            onClick={() => setFilterLine(l)}
                            className={`w-5 h-5 rounded-full text-[10px] font-bold ${LINE_COLORS[l]} ${filterLine === l ? 'ring-2 ring-white' : 'opacity-70'}`}
                          >
                            {l}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-3 max-h-[260px] overflow-y-auto pr-1">
                      {filteredAlerts.length === 0 ? (
                        <p className="text-xs opacity-60 italic text-center py-4">No active disruptions reported for line {filterLine}.</p>
                      ) : (
                        filteredAlerts.map(alert => (
                          <div key={alert.id} className="p-3 rounded-lg border border-slate-800 bg-slate-900/60 flex items-start space-x-3 text-xs">
                            <span className={`w-6 h-6 rounded-full flex items-center justify-center font-bold shrink-0 ${alert.lineBg}`}>
                              {alert.line}
                            </span>
                            <div className="flex-1">
                              <p className="leading-relaxed">{alert.message}</p>
                              <span className="text-[10px] opacity-50 mt-1 block">GTFS Realtime Verified</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <div className={`p-5 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <Icon name="alert-triangle" className="w-4 h-4 text-red-400" />
                        {t.equipmentOutageTitle}
                      </h2>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-red-500/20 text-red-400 border border-red-500/30">
                        Live Outage Stream
                      </span>
                    </div>

                    <div className="space-y-3 max-h-[260px] overflow-y-auto pr-1">
                      {equipmentOutages.map(eq => (
                        <div key={eq.id} className="p-3 rounded-lg border border-slate-800 bg-slate-900/60 text-xs space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-200">{eq.stationName}</span>
                            {eq.status === 'OUT_OF_SERVICE' ? (
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-1">
                                <Icon name="x-circle" className="w-3 h-3" /> OUT OF SERVICE
                              </span>
                            ) : (
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
                                <Icon name="check-circle-2" className="w-3 h-3" /> OPERATIONAL
                              </span>
                            )}
                          </div>
                          <p className="text-slate-400 text-[11px]">{eq.equipment}</p>
                          
                          {eq.status === 'OUT_OF_SERVICE' && (
                            <div className="pt-1.5 border-t border-slate-800/80 flex items-start justify-between text-[11px] text-amber-300">
                              <span>Workaround: {eq.workaround}</span>
                              <span className="shrink-0 text-slate-500 font-mono text-[10px]">{eq.eta}</span>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* In-Station Hub Navigation */}
                <section className={`p-5 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div>
                      <h2 className="text-base font-bold flex items-center gap-2">
                        <Icon name="compass" className="w-5 h-5 text-emerald-400" />
                        {t.wayfindingTitle}
                      </h2>
                      <p className="text-xs opacity-75">{t.selectHub}</p>
                    </div>

                    <div className="flex space-x-2">
                      {WAYFINDING_HUBS.map(hub => (
                        <button
                          key={hub.id}
                          onClick={() => setSelectedHubId(hub.id)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${
                            selectedHubId === hub.id
                              ? 'bg-emerald-600 border-emerald-500 text-white'
                              : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          {hub.id} Hub
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="p-4 rounded-xl border border-slate-800 bg-slate-900/40 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="md:col-span-2 space-y-3">
                      <h3 className="text-sm font-bold text-emerald-400">{activeHubData.name}</h3>
                      <div className="space-y-2 text-xs">
                        {activeHubData.steps.map((st, i) => (
                          <div key={i} className="flex items-start space-x-2 p-2 rounded bg-slate-950/60 border border-slate-800/80">
                            <span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">
                              {i + 1}
                            </span>
                            <span className="leading-relaxed">
                              {lang === 'es' ? st.textEs : lang === 'zh' ? st.textZh : st.textEn}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-3 border-t md:border-t-0 md:border-l border-slate-800 md:pl-4 pt-3 md:pt-0">
                      <div>
                        <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">{t.transferTime}</span>
                        <p className="text-lg font-bold text-white flex items-center gap-1.5 mt-0.5">
                          <Icon name="clock" className="w-4 h-4 text-blue-400" />
                          ~{activeHubData.transferWalkMinutes} mins
                        </p>
                      </div>

                      <div className="p-2.5 rounded bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs">
                        <p className="font-bold mb-0.5 flex items-center gap-1">
                          <Icon name="alert-triangle" className="w-3.5 h-3.5" />
                          Stair Avoidance Notice
                        </p>
                        <p className="text-[11px] opacity-90">{activeHubData.avoidStairsNotice}</p>
                      </div>

                      <div className="pt-2 border-t border-slate-800">
                        <p className="text-[10px] text-slate-400 mb-1">{t.emergencyTitle}</p>
                        <a 
                          href="tel:511" 
                          className="px-3 py-1.5 rounded-lg bg-red-600/80 hover:bg-red-600 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition"
                        >
                          <Icon name="phone" className="w-3.5 h-3.5" />
                          {t.emergencyCall}
                        </a>
                      </div>
                    </div>
                  </div>
                </section>

                {/* Saved Favorite Routes */}
                <section className={`p-5 rounded-xl border ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/70'}`}>
                  <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                    <Icon name="bookmark" className="w-4 h-4 text-blue-400" />
                    {t.savedRoutesTitle}
                  </h2>

                  {savedRoutes.length === 0 ? (
                    <p className="text-xs opacity-60 py-2 italic">{t.noSavedRoutes}</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      {savedRoutes.map(fav => (
                        <div key={fav.id} className="p-3 rounded-lg border border-slate-800 bg-slate-900/60 text-xs flex justify-between items-center">
                          <div>
                            <p className="font-bold text-slate-200">{fav.originName} → {fav.destName}</p>
                            <p className="text-[10px] opacity-60 mt-0.5">{fav.duration} mins • Lines: {fav.lines?.join(', ')}</p>
                          </div>
                          <button 
                            onClick={() => removeSavedRoute(fav.id)}
                            className="p-1.5 text-slate-400 hover:text-red-400 transition"
                          >
                            <Icon name="x-circle" className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </section>
              </>
            )}
          </main>

          <footer className="border-t border-slate-800 mt-12 py-6 text-center text-xs opacity-60">
            <p>© 2026 NYC Transit Hub Pro • Powered by GTFS Realtime & MTA Accessible Equipment APIs</p>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
