    const interpolate = (template, values = {}) =>
      String(template).replace(/\{(\w+)\}/g, (_, key) =>
        values[key] !== undefined ? values[key] : `{${key}}`
      );

    const LANGUAGE_STORAGE_KEY = 'nyc_transit_language';
    const getSavedLanguage = () => {
      try {
        const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        return LANGUAGE_OPTIONS.some((option) => option.code === saved) ? saved : 'en';
      } catch (_error) {
        return 'en';
      }
    };
    const persistLanguage = (language) => {
      try {
        localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
      } catch (_error) {
        // Storage may be blocked by browser tracking prevention. The current
        // session still changes language, but it will not persist after reload.
      }
    };

    const PREFERENCES_STORAGE_KEY = 'nyc_transit_preferences_v1';
    const ACHIEVEMENTS_STORAGE_KEY = 'metro_sync_achievements_v1';
    const SESSION_STORAGE_KEY = 'nyc_transit_session_v1';

    const readStoredJson = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_error) {
        return fallback;
      }
    };

    const writeStoredJson = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_error) {
        // The current session remains usable when browser storage is blocked.
      }
    };

    const getSavedPreferences = () =>
      readStoredJson(PREFERENCES_STORAGE_KEY, {
        preferStepFree: true,
        notifyOutages: true,
        maxTransfers: 2,
        ecoGamification: true
      });

    const getSavedSession = () => readStoredJson(SESSION_STORAGE_KEY, null);

    const getSavedAchievements = () => {
      const achievements = globalThis.MetroAchievements;
      return achievements.normalize(
        readStoredJson(ACHIEVEMENTS_STORAGE_KEY, null)
      );
    };

    function App() {
      // Navigation State
      const [currentView, setCurrentView] = useState('map');
      
      // Accessibility Controls
      const [highContrast, setHighContrast] = useState(false);
      const [useAltMap, setUseAltMap] = useState(false);

      // User Sign-In State
      const [currentUser, setCurrentUser] = useState(() =>
        getSavedSession() || {
          isLoggedIn: false,
          email: '',
          displayName: ''
        }
      );
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'forgot'
      const [authName, setAuthName] = useState('');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authConfirmPassword, setAuthConfirmPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [authNotice, setAuthNotice] = useState('');

      // Route Planner State
      const [origin, setOrigin] = useState('127');
      const [destination, setDestination] = useState('235');
      const [selectedRouteOption, setSelectedRouteOption] = useState(0);
      const [routeResults, setRouteResults] = useState([]);

      // Saved Favorite Routes
      const [savedRoutes, setSavedRoutes] = useState(() => {
        try {
          const stored = localStorage.getItem('nyc_transit_saved_routes');
          return stored ? JSON.parse(stored) : [
            {
              id: 101,
              nickname: 'Daily Work Commute',
              originId: '127',
              destId: '235',
              originName: 'Times Sq - 42 St',
              destName: 'Atlantic Av - Barclays Ctr',
              lines: ['N', 'Q'],
              duration: 18
            }
          ];
        } catch (e) {
          return [];
        }
      });
      const [editingId, setEditingId] = useState(null);
      const [editNameText, setEditNameText] = useState('');

      // User Preferences
      const [preferences, setPreferences] = useState(getSavedPreferences);
      const [journeyProgress, setJourneyProgress] = useState(getSavedAchievements);
      const [toastMsg, setToastMsg] = useState('');

      // --- De-coupled Offline Assistant State ("What-If" Feature Toggle Ready) ---
      const [isAssistantOpen, setIsAssistantOpen] = useState(false);
      const [assistantInput, setAssistantInput] = useState('');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [assistantMessages, setAssistantMessages] = useState([
        { id: 1, sender: 'bot', text: 'Hello! I am your Offline NYC Transit Assistant. Ask me about delays, elevator accessibility, or places near your stop.' }
      ]);

      // Network Listener for Online/Offline state
      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // Generic Map References
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const polylineRef = useRef(null);
      const markersGroupRef = useRef(null);

      const [lang, setLang] = useState(getSavedLanguage);
      const [draftLanguage, setDraftLanguage] = useState(getSavedLanguage);
      const [geoData, setGeoData] = useState({ lines: null, stations: null });
      const [stationsData, setStationsData] = useState(STATIONS_FALLBACK);
      const [liveTrains, setLiveTrains] = useState([]);
      const [liveTrainCount, setLiveTrainCount] = useState(0);
      const [liveFetchedAt, setLiveFetchedAt] = useState(null);
      const [liveDataError, setLiveDataError] = useState('');
      const [outages, setOutages] = useState(INITIAL_ELEVATOR_OUTAGES);
      const [outageError, setOutageError] = useState('');
      const [routeLoading, setRouteLoading] = useState(false);
      const [routeError, setRouteError] = useState('');
      const t = (key, values) =>
        interpolate(
          FEATURE_TRANSLATIONS[lang]?.[key] ??
            FEATURE_TRANSLATIONS.en[key] ??
            TRANSLATIONS[lang]?.[key] ??
            TRANSLATIONS.en[key] ??
            key,
          values
        );
      const stationOptions = useMemo(
        () => Object.values(stationsData).sort((a, b) => a.name.localeCompare(b.name)),
        [stationsData]
      );
      const achievementStats = useMemo(
        () => globalThis.MetroAchievements.stats(journeyProgress),
        [journeyProgress]
      );
      const activeJourney = journeyProgress.active;
      const achievementCopy = (definition, field) => {
        const key = `achievement_${definition.id.replaceAll('-', '_')}_${field}`;
        return (
          FEATURE_TRANSLATIONS[lang]?.[key] ??
          FEATURE_TRANSLATIONS.en[key] ??
          definition[field]
        );
      };

      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = 'ltr';
      }, [lang]);

      useEffect(() => {
        writeStoredJson(PREFERENCES_STORAGE_KEY, preferences);
      }, [preferences]);

      useEffect(() => {
        writeStoredJson('nyc_transit_saved_routes', savedRoutes);
      }, [savedRoutes]);

      useEffect(() => {
        writeStoredJson(ACHIEVEMENTS_STORAGE_KEY, journeyProgress);
      }, [journeyProgress]);

      useEffect(() => {
        let disposed = false;
        fetch(apiUrl('/api/v1/stations'))
          .then((response) => {
            if (!response.ok) throw new Error(`Stations API returned ${response.status}`);
            return response.json();
          })
          .then((data) => {
            if (disposed || !Array.isArray(data.stations) || data.stations.length === 0) return;
            const nextStations = Object.fromEntries(
              data.stations.map((station) => [station.id, station])
            );
            setStationsData(nextStations);
            setOrigin((current) => nextStations[current] ? current : data.stations[0].id);
            setDestination((current) => nextStations[current] ? current : data.stations[1].id);
          })
          .catch((error) => {
            console.error('Unable to load stations from Express:', error);
          });
        return () => { disposed = true; };
      }, []);

      useEffect(() => {
        let disposed = false;

        const loadLiveData = async () => {
          const [trainsResult, outagesResult] = await Promise.allSettled([
            fetch(apiUrl('/api/v1/trains/live')).then((response) => {
              if (!response.ok) throw new Error(`Train API returned ${response.status}`);
              return response.json();
            }),
            fetch(apiUrl('/api/v1/accessibility')).then((response) => {
              if (!response.ok) throw new Error(`Accessibility API returned ${response.status}`);
              return response.json();
            })
          ]);

          if (disposed) return;

          if (trainsResult.status === 'fulfilled') {
            setLiveTrains(trainsResult.value.trains || []);
            setLiveTrainCount(trainsResult.value.trainCount || 0);
            setLiveFetchedAt(trainsResult.value.timestamp || trainsResult.value.cachedAt || null);
            setLiveDataError('');
          } else {
            setLiveDataError('liveUnavailable');
          }

          if (outagesResult.status === 'fulfilled') {
            setOutages(outagesResult.value.outages || []);
            setOutageError('');
          } else {
            setOutageError('outagesUnavailable');
          }
        };

        loadLiveData();
        const timer = setInterval(loadLiveData, 30000);
        return () => {
          disposed = true;
          clearInterval(timer);
        };
      }, []);

      useEffect(() => {
        if (currentView !== 'map' || useAltMap || !mapContainerRef.current) {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
            markersGroupRef.current = null;
            polylineRef.current = null;
          }
          return;
        }

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, { center: [40.730, -73.980], zoom: 11, zoomControl: true });
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
          mapInstanceRef.current = map;
          markersGroupRef.current = L.layerGroup().addTo(map);
        }

        const loadGeoJSON = async () => {
          const response = await fetch(apiUrl('/api/v1/routes/shapes'));
          if (!response.ok) throw new Error(`Map API returned ${response.status}`);
          const data = await response.json();
          setGeoData({ lines: data.lines, stations: data.stations });
        };
        if (!geoData.lines) loadGeoJSON();
      }, [currentView, useAltMap]);

      // 渲染 GeoJSON
      useEffect(() => {
        if (!mapInstanceRef.current || !geoData.lines || !markersGroupRef.current) return;
        markersGroupRef.current.clearLayers();

        L.geoJSON(geoData.lines, {
          style: (feature) => ({
            color: feature.properties.route_color || HEX_LINE_COLORS[displayRouteId(feature.properties.route_id)] || '#808080',
            weight: 4,
            opacity: 0.8
          })
        }).addTo(mapInstanceRef.current);

        L.geoJSON(geoData.stations, {
          pointToLayer: (feature, latlng) => {
            const lineStr = feature.properties.daytime_routes || '';
            let parsedLines = lineStr.split(/[\s,]+/).map(l => l === 'SIR' ? 'S' : l.split('')).flat().filter(c => HEX_LINE_COLORS[c]);
            parsedLines = [...new Set(parsedLines)];
            let fillColor = parsedLines.length === 1 ? HEX_LINE_COLORS[parsedLines[0]] : '#ffffff';
            return L.circleMarker(latlng, { radius: 5, fillColor: fillColor, color: '#0f172a', weight: 2, fillOpacity: 1 });
          },
          onEachFeature: (feature, layer) => {
            const name = feature.properties.stop_name || 'Unknown';
            const lines = (feature.properties.daytime_routes || '').split(' ').join(', ');
            layer.bindPopup(`<div class="text-xs"><b>${name}</b><br/>${lines}</div>`);
          }
        }).addTo(markersGroupRef.current);
      }, [geoData]);


      // Server-side all-station route planning. The frontend sends parent
      // station IDs; the backend resolves direction-specific platforms.
      useEffect(() => {
        if (!stationsData[origin] || !stationsData[destination]) return;
        if (origin === destination) {
          setRouteResults([]);
          setRouteError('');
          return;
        }

        const controller = new AbortController();
        setRouteLoading(true);
        setRouteError('');

        fetch(apiUrl(`/api/v1/routes/plan?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&maxOptions=3`), {
          signal: controller.signal
        })
          .then((response) => {
            if (!response.ok) throw new Error(`Route API returned ${response.status}`);
            return response.json();
          })
          .then((data) => {
            setRouteResults(data.routes || []);
            setSelectedRouteOption(0);
            if (!data.routes?.length) {
              setRouteError('noRouteFound');
            }
          })
          .catch((error) => {
            if (error.name !== 'AbortError') {
              console.error('Route planning failed:', error);
              setRouteError('routeLoadFailed');
              setRouteResults([]);
            }
          })
          .finally(() => {
            if (!controller.signal.aborted) setRouteLoading(false);
          });

        return () => controller.abort();
      }, [origin, destination, stationsData]);

      useEffect(() => {
        if (!mapInstanceRef.current) return;
        if (polylineRef.current) {
          mapInstanceRef.current.removeLayer(polylineRef.current);
          polylineRef.current = null;
        }

        const selectedRoute = routeResults.find((route) => route.id === selectedRouteOption);
        if (!selectedRoute?.polyline?.length) return;

        const activeLine = selectedRoute.lines?.[0] || '1';
        polylineRef.current = L.polyline(selectedRoute.polyline, {
          color: HEX_LINE_COLORS[activeLine] || '#3b82f6',
          weight: 5,
          opacity: 0.9,
          dashArray: '8, 6'
        }).addTo(mapInstanceRef.current);
        mapInstanceRef.current.fitBounds(polylineRef.current.getBounds(), { padding: [40, 40] });
      }, [routeResults, selectedRouteOption, geoData, currentView, useAltMap]);


      // Sign-In Handlers
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const email = authEmail.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setAuthNotice(t('validEmailRequired'));
          return;
        }

        if (authMode === 'forgot') {
          setAuthNotice(t('resetSent', { email }));
          setTimeout(() => {
            setAuthMode('login');
            setAuthNotice('');
          }, 2500);
          return;
        }

        if (authPassword.length < 8) {
          setAuthNotice(t('passwordLength'));
          return;
        }

        if (authMode === 'signup') {
          if (!authName.trim()) {
            setAuthNotice(t('nameRequired'));
            return;
          }
          if (authPassword !== authConfirmPassword) {
            setAuthNotice(t('passwordsMismatch'));
            return;
          }
        }

        const displayName = authName.trim() || email.split('@')[0];
        const nextUser = {
          isLoggedIn: true,
          email,
          displayName
        };
        setCurrentUser(nextUser);
        if (rememberMe) {
          writeStoredJson(SESSION_STORAGE_KEY, nextUser);
        } else {
          try {
            localStorage.removeItem(SESSION_STORAGE_KEY);
          } catch (_error) {
            // Storage may be unavailable under strict browser privacy settings.
          }
        }
        showToast(t('welcomeUser', { email }));
        setIsAuthModalOpen(false);
        setAuthNotice('');
      };

      const handleSignOut = () => {
        setCurrentUser({ isLoggedIn: false, email: '', displayName: '' });
        try {
          localStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (_error) {
          // Storage may be unavailable under strict browser privacy settings.
        }
        showToast(t('signedOut'));
      };

      // Favorite Route Handlers
      const handleSaveRoute = (opt) => {
        const startSt = stationsData[origin];
        const endSt = stationsData[destination];
        
        const newRoute = {
          id: Date.now(),
          nickname: `${startSt.name} ➔ ${endSt.name}`,
          originId: origin,
          destId: destination,
          originName: startSt.name,
          destName: endSt.name,
          lines: opt.lines,
          duration: opt.duration
        };

        setSavedRoutes(prev => [newRoute, ...prev]);
        setJourneyProgress((current) =>
          globalThis.MetroAchievements.bookmark(current, new Date().toISOString())
        );
        showToast(t('routeSaved'));
      };

      const handleStartEdit = (fav) => {
        setEditingId(fav.id);
        setEditNameText(fav.nickname);
      };

      const handleSaveEdit = (id) => {
        setSavedRoutes(prev => prev.map(r => r.id === id ? { ...r, nickname: editNameText } : r));
        setEditingId(null);
        showToast(t('routeNameUpdated'));
      };

      const handleDeleteRoute = (id) => {
        setSavedRoutes(prev => prev.filter(r => r.id !== id));
        showToast(t('routeRemoved'));
      };

      const handleLoadRoute = (fav) => {
        setOrigin(fav.originId);
        setDestination(fav.destId);
        setCurrentView('map');
        showToast(t('routeLoaded', { name: fav.nickname }));
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleSaveLanguage = () => {
        setLang(draftLanguage);
        persistLanguage(draftLanguage);
        showToast(
          interpolate(TRANSLATIONS[draftLanguage]?.languageSaved || TRANSLATIONS.en.languageSaved)
        );
      };

      const handleStartJourney = () => {
        const journeyId =
          globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
        setJourneyProgress((current) =>
          globalThis.MetroAchievements.start(current, origin, destination, journeyId)
        );
        showToast(t('journeyStarted'));
      };

      const handleCompleteJourney = () => {
        const now = new Date().toISOString();
        const previous = journeyProgress;
        const next = globalThis.MetroAchievements.complete(previous, now);
        setJourneyProgress(next);
        const newlyUnlocked = globalThis.MetroAchievements.definitions.filter(
          (definition) =>
            !previous.unlocked[definition.id] && next.unlocked[definition.id]
        );
        if (newlyUnlocked.length > 0) {
          showToast(
            t('achievementUnlocked', {
              name: achievementCopy(newlyUnlocked[0], 'name')
            })
          );
        } else {
          showToast(t('journeyCompleted'));
        }
      };

      const handleCancelJourney = () => {
        setJourneyProgress((current) =>
          globalThis.MetroAchievements.cancel(current)
        );
      };

      // Assistant Message Submission
      const handleSendAssistantMsg = (userText) => {
        const textToProcess = userText || assistantInput;
        if (!textToProcess.trim()) return;

        const userMsgObj = { id: Date.now(), sender: 'user', text: textToProcess };
        const responseText = runOfflineAssistantQuery(textToProcess, origin, destination, stationsData, routeResults);
        const botMsgObj = { id: Date.now() + 1, sender: 'bot', text: responseText };

        setAssistantMessages(prev => [...prev, userMsgObj, botMsgObj]);
        setAssistantInput('');
      };

      const formatRouteSteps = (route) => {
        if (!Array.isArray(route.segments)) return route.steps || [];
        const steps = [];
        route.segments.forEach((segment) => {
          const minutes = Math.max(1, Math.round(segment.durationSeconds / 60));
          if (segment.kind === 'subway') {
            steps.push(t('rideRoute', {
              line: segment.line,
              from: segment.fromName,
              to: segment.toName,
              minutes,
              stops: Math.max(1, (segment.stopIds?.length || 2) - 1)
            }));
          } else if (segment.fromName !== segment.toName) {
            steps.push(t('transferWalk', {
              from: segment.fromName,
              to: segment.toName,
              minutes
            }));
          }
        });
        steps.push(t('arriveAt', {
          station: stationsData[destination]?.name || route.destinationId
        }));
        return steps;
      };

      return (
        <div className={`min-h-screen transition-colors duration-200 ${highContrast ? 'bg-black text-yellow-300 font-mono' : 'bg-slate-900 text-slate-100 font-sans'}`}>
          
          {/* Notification Toast */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-blue-600 text-white px-5 py-3.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2.5 border border-blue-400">
              <Icon name="bookmark" className="w-4 h-4" />
              {toastMsg}
            </div>
          )}

          {/* Offline Assistant Floating Trigger Button */}
          <button
            onClick={() => setIsAssistantOpen(!isAssistantOpen)}
            className="fixed bottom-6 left-6 z-40 bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-full shadow-2xl flex items-center gap-2 font-bold text-xs border border-blue-400 transition hover:scale-105"
            title={t('offlineAssistant')}
          >
            <Icon name="message-square" className="w-5 h-5" />
            <span className="hidden sm:inline">{t('offlineAssistant')}</span>
          </button>

          {/* Offline Assistant Drawer */}
          {isAssistantOpen && (
            <div className="fixed bottom-20 left-6 z-50 w-80 sm:w-96 bg-slate-950 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col space-y-0">
              <div className="bg-slate-900 p-3.5 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <div className="w-7 h-7 rounded-lg bg-blue-600/30 text-blue-400 border border-blue-500 flex items-center justify-center font-bold text-xs">
                    AI
                  </div>
                  <div>
                    <p className="font-bold text-xs text-white">{t('transitAssistant')}</p>
                    <p className="text-[10px] text-emerald-400 flex items-center gap-1">
                      <span>⚡ {isOnline ? t('onlineSync') : t('offlineMode')}</span>
                    </p>
                  </div>
                </div>
                <button onClick={() => setIsAssistantOpen(false)} className="text-slate-400 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>

              {/* Chat Message History */}
              <div className="p-3 h-64 overflow-y-auto space-y-2 text-xs bg-slate-900/40">
                {assistantMessages.map(m => (
                  <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] p-2.5 rounded-xl ${
                      m.sender === 'user' 
                        ? 'bg-blue-600 text-white rounded-br-none' 
                        : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              {/* Quick Action Chips */}
              <div className="p-2 bg-slate-950 border-t border-slate-800 flex flex-wrap gap-1">
                <button onClick={() => handleSendAssistantMsg("Is route step-free accessible?")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700">
                  ♿ {t('stepFreeAccess')}
                </button>
                <button onClick={() => handleSendAssistantMsg("Check subway delays")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700">
                  ⚠️ {t('checkDelays')}
                </button>
                <button onClick={() => handleSendAssistantMsg("Food near stop")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700">
                  🍕 {t('nearbyFood')}
                </button>
              </div>

              {/* Input Form */}
              <form onSubmit={(e) => { e.preventDefault(); handleSendAssistantMsg(); }} className="p-2 bg-slate-950 border-t border-slate-800 flex items-center gap-2">
                <input 
                  type="text"
                  value={assistantInput}
                  onChange={(e) => setAssistantInput(e.target.value)}
                  placeholder={t('askAssistant')}
                  className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                />
                <button type="submit" className="p-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs">
                  <Icon name="send" className="w-3.5 h-3.5" />
                </button>
              </form>
            </div>
          )}

          {/* Account Modal */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative space-y-4">
                <button 
                  onClick={() => setIsAuthModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <div className="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold border border-blue-500/30">
                    MTA
                  </div>
                  <h3 className="text-lg font-bold text-white">
                    {authMode === 'login' && t('signInTitle')}
                    {authMode === 'signup' && t('signUpTitle')}
                    {authMode === 'forgot' && t('forgotTitle')}
                  </h3>
                  <p className="text-xs text-slate-400">
                    {authMode === 'login' && t('signInDesc')}
                    {authMode === 'signup' && t('signUpDesc')}
                    {authMode === 'forgot' && t('forgotDesc')}
                  </p>
                </div>

                {authNotice && (
                  <div className="p-3 bg-blue-950/60 border border-blue-500/40 rounded-xl text-xs text-blue-300 text-center font-medium">
                    {authNotice}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">{t('fullName')}</label>
                      <input
                        type="text"
                        required
                        value={authName}
                        onChange={(e) => setAuthName(e.target.value)}
                        placeholder="Ada Lovelace"
                        autoComplete="name"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">{t('emailAddress')}</label>
                    <input 
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      placeholder="rider@example.com"
                      autoComplete="email"
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  {authMode !== 'forgot' && (
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">{t('password')}</label>
                      <input 
                        type="password"
                        required
                        minLength={8}
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        placeholder="••••••••"
                        autoComplete={authMode === 'signup' ? 'new-password' : 'current-password'}
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                      />
                      {authMode === 'signup' && (
                        <p className="text-[11px] text-slate-500 mt-1">{t('passwordHint')}</p>
                      )}
                    </div>
                  )}

                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">{t('confirmPassword')}</label>
                      <input
                        type="password"
                        required
                        minLength={8}
                        value={authConfirmPassword}
                        onChange={(e) => setAuthConfirmPassword(e.target.value)}
                        placeholder="••••••••"
                        autoComplete="new-password"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  )}

                  {authMode === 'login' && (
                    <label className="flex items-center gap-2 text-slate-300 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={rememberMe}
                        onChange={(e) => setRememberMe(e.target.checked)}
                        className="w-4 h-4 rounded text-blue-600"
                      />
                      {t('rememberMe')}
                    </label>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg transition"
                  >
                    {authMode === 'login' && t('signIn')}
                    {authMode === 'signup' && t('createAccount')}
                    {authMode === 'forgot' && t('sendReset')}
                  </button>
                </form>

                <div className="pt-2 border-t border-slate-800 text-center text-xs text-slate-400 flex justify-center gap-4">
                  {authMode === 'login' ? (
                    <>
                      <button onClick={() => { setAuthMode('signup'); setAuthNotice(''); }} className="hover:text-white underline">{t('needAccount')}</button>
                      <button onClick={() => { setAuthMode('forgot'); setAuthNotice(''); }} className="hover:text-white underline">{t('forgotPassword')}</button>
                    </>
                  ) : (
                    <button onClick={() => { setAuthMode('login'); setAuthNotice(''); }} className="hover:text-white underline">{t('backSignIn')}</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Top Header */}
          <header className={`border-b ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/90'} backdrop-blur sticky top-0 z-40`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl shadow-lg ${highContrast ? 'bg-yellow-400 text-black' : 'bg-blue-600 text-white'}`}>
                  MTA
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    NYC Transit Hub Pro
                    <span className="text-[10px] uppercase tracking-widest px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-mono">
                      {t('liveUpdates')}
                    </span>
                  </h1>
                  <p className="text-xs opacity-75 text-slate-400">{t('subtitle')}</p>
                </div>
              </div>

              {/* View & Accessibility Toggle */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setHighContrast(!highContrast)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 border transition ${
                    highContrast ? 'bg-yellow-400 text-black border-yellow-300' : 'bg-slate-800 text-slate-300 border-slate-700 hover:text-white'
                  }`}
                >
                  <Icon name="eye" className="w-3.5 h-3.5" />
                  {highContrast ? t('standardMode') : t('highContrast')}
                </button>

                <nav className="flex items-center space-x-1 border rounded-xl p-1 border-slate-800 bg-slate-900">
                  <button
                    onClick={() => setCurrentView('map')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                      currentView === 'map' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <Icon name="map" className="w-3.5 h-3.5" />
                    {t('mapRoutes')}
                  </button>

                  <button
                    onClick={() => setCurrentView('profile')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                      currentView === 'profile' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <Icon name="user" className="w-3.5 h-3.5" />
                    {t('profileFavorites')} ({savedRoutes.length})
                  </button>
                </nav>

                {/* Account Controls */}
                <div className="pl-2 border-l border-slate-800">
                  {currentUser.isLoggedIn ? (
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-blue-600/30 border border-blue-500 text-blue-400 flex items-center justify-center text-xs font-bold">
                        {currentUser.displayName ? currentUser.displayName[0].toUpperCase() : 'U'}
                      </div>
                      <div className="hidden sm:block text-left text-[11px]">
                        <p className="font-bold text-white leading-none">{currentUser.displayName}</p>
                        <p className="text-slate-400 leading-none text-[10px] mt-0.5">{currentUser.email}</p>
                      </div>
                      <button
                        onClick={handleSignOut}
                        className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white text-xs font-semibold border border-slate-700 transition"
                      >
                        {t('signOut')}
                      </button>
                    </div>
                  ) : (
                    <button
                      onClick={() => { setAuthMode('login'); setAuthNotice(''); setIsAuthModalOpen(true); }}
                      className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow transition flex items-center gap-1.5"
                    >
                      <Icon name="log-in" className="w-3.5 h-3.5" />
                      {t('signInRegister')}
                    </button>
                  )}
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">

            {/* VIEW 1: PROFILE & SAVED FAVORITES */}
            {currentView === 'profile' && (
              <div className="max-w-4xl mx-auto space-y-6">
                
                {/* Profile Overview */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center space-x-4">
                    <div className="w-14 h-14 rounded-full bg-blue-600/20 border-2 border-blue-500 flex items-center justify-center text-blue-400 text-xl font-bold">
                      {currentUser.isLoggedIn ? currentUser.displayName[0].toUpperCase() : 'G'}
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white">
                        {currentUser.isLoggedIn ? t('profileSuffix', { name: currentUser.displayName }) : t('guestProfile')}
                      </h2>
                      <p className="text-xs text-slate-400">
                        {currentUser.isLoggedIn ? currentUser.email : t('demoMode')}
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-4 text-center">
                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-800">
                      <p className="text-xs text-slate-400">{t('totalRides')}</p>
                      <p className="text-base font-bold text-white">{achievementStats.rides}</p>
                    </div>
                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-800">
                      <p className="text-xs text-slate-400">{t('co2Saved')}</p>
                      <p className="text-base font-bold text-emerald-400">{(achievementStats.rides * 1.8).toFixed(1)} kg</p>
                    </div>
                  </div>
                </div>

                {/* Journey Achievements */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        <Icon name="trophy" className="w-5 h-5 text-amber-400" />
                        {t('achievementsTitle')}
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        {t('achievementProgress', {
                          unlocked: Object.keys(journeyProgress.unlocked).length,
                          total: globalThis.MetroAchievements.definitions.length
                        })}
                      </p>
                    </div>
                    <div className="w-32 h-2 rounded-full bg-slate-800 overflow-hidden">
                      <div
                        className="h-full rounded-full bg-gradient-to-r from-blue-500 to-emerald-400"
                        style={{
                          width: `${(
                            Object.keys(journeyProgress.unlocked).length /
                            globalThis.MetroAchievements.definitions.length
                          ) * 100}%`
                        }}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    {globalThis.MetroAchievements.definitions.map((definition) => {
                      const currentValue = achievementStats[definition.metric] || 0;
                      const unlockedAt = journeyProgress.unlocked[definition.id];
                      const progress = Math.min(100, (currentValue / definition.target) * 100);
                      return (
                        <div
                          key={definition.id}
                          className={`p-3 rounded-xl border ${
                            unlockedAt
                              ? 'bg-amber-500/10 border-amber-500/40'
                              : 'bg-slate-900 border-slate-800'
                          }`}
                        >
                          <div className="flex items-start gap-3">
                            <span className={`text-2xl ${unlockedAt ? '' : 'grayscale opacity-50'}`}>
                              {definition.icon}
                            </span>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center justify-between gap-2">
                                <p className={`font-bold ${unlockedAt ? 'text-amber-300' : 'text-slate-300'}`}>
                                  {achievementCopy(definition, 'name')}
                                </p>
                                <span className="text-[10px] text-slate-500 font-mono">
                                  {Math.min(currentValue, definition.target)}/{definition.target}
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-0.5">
                                {achievementCopy(definition, 'description')}
                              </p>
                              <div className="h-1.5 mt-2 rounded-full bg-slate-800 overflow-hidden">
                                <div
                                  className={`h-full rounded-full ${unlockedAt ? 'bg-amber-400' : 'bg-blue-500'}`}
                                  style={{ width: `${progress}%` }}
                                />
                              </div>
                              {unlockedAt && (
                                <p className="text-[10px] text-amber-500/80 mt-1">
                                  {new Date(unlockedAt).toLocaleDateString(lang)}
                                </p>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Saved Favorite Routes */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        <Icon name="bookmark" className="w-5 h-5 text-blue-400" />
                        {t('savedRoutesTitle')}
                      </h2>
                      <p className="text-xs text-slate-400">{t('savedRoutesDesc')}</p>
                    </div>
                    <span className="text-xs font-mono px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300">
                      {t('savedCount', { count: savedRoutes.length })}
                    </span>
                  </div>

                  {savedRoutes.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-xs">
                      <Icon name="bookmark" className="w-8 h-8 mx-auto mb-2 opacity-50" />
                      {t('noSavedRoutes')}
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {savedRoutes.map(fav => (
                        <div key={fav.id} className="p-4 rounded-xl border border-slate-800 bg-slate-900/80 flex flex-wrap items-center justify-between gap-4">
                          {editingId === fav.id ? (
                            <div className="flex items-center gap-2 flex-1">
                              <input 
                                type="text"
                                value={editNameText}
                                onChange={(e) => setEditNameText(e.target.value)}
                                className="p-2 rounded-lg bg-slate-950 border border-blue-500 text-white text-xs flex-1 focus:outline-none"
                                placeholder={t('routeNamePlaceholder')}
                              />
                              <button 
                                onClick={() => handleSaveEdit(fav.id)}
                                className="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                              >
                                {t('save')}
                              </button>
                            </div>
                          ) : (
                            <div className="space-y-1">
                              <p className="font-bold text-sm text-slate-100 flex items-center gap-2">
                                <span>{fav.nickname}</span>
                                <button onClick={() => handleStartEdit(fav)} className="text-slate-400 hover:text-blue-400 transition" title={t('renameRoute')}>
                                  <Icon name="pencil" className="w-3.5 h-3.5" />
                                </button>
                              </p>
                              <p className="text-xs text-slate-400">
                                {fav.originName} ➔ {fav.destName} • {fav.duration} mins
                              </p>
                              <div className="flex items-center gap-1.5 mt-1">
                                {fav.lines.map((l, i) => (
                                  <LineBadge key={i} line={l} size="w-5 h-5 text-[10px]" />
                                ))}
                              </div>
                            </div>
                          )}

                          <div className="flex items-center gap-2">
                            <button 
                              onClick={() => handleLoadRoute(fav)}
                              className="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center gap-1.5 transition shadow"
                            >
                              <Icon name="navigation" className="w-3.5 h-3.5" /> {t('showOnMap')}
                            </button>
                            <button 
                              onClick={() => handleDeleteRoute(fav.id)}
                              className="p-2 rounded-lg bg-slate-800 hover:bg-red-600 text-slate-400 hover:text-white transition"
                              title={t('deleteRoute')}
                            >
                              <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Interface Language */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <div>
                    <h2 className="text-base font-bold text-white flex items-center gap-2">
                      <Icon name="languages" className="w-5 h-5 text-blue-400" />
                      {t('languageTitle')}
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">{t('languageDesc')}</p>
                  </div>

                  <div className="flex flex-col sm:flex-row sm:items-end gap-3">
                    <div className="flex-1">
                      <label htmlFor="languageSelect" className="block text-slate-300 font-semibold mb-1 text-xs">
                        {t('interfaceLanguage')}
                      </label>
                      <select
                        id="languageSelect"
                        value={draftLanguage}
                        onChange={(event) => setDraftLanguage(event.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white font-medium text-xs focus:outline-none focus:border-blue-500"
                      >
                        {LANGUAGE_OPTIONS.map((option) => (
                          <option key={option.code} value={option.code}>{option.label}</option>
                        ))}
                      </select>
                    </div>
                    <button
                      type="button"
                      onClick={handleSaveLanguage}
                      disabled={draftLanguage === lang}
                      className="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold text-xs transition"
                    >
                      {t('saveLanguage')}
                    </button>
                  </div>
                </div>

                {/* Commute Preferences */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <h2 className="text-base font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                    <Icon name="sliders" className="w-5 h-5 text-blue-400" />
                    {t('commuterPreferences')}
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <label className="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-900 cursor-pointer">
                      <span className="text-slate-300 font-semibold">{t('preferStepFree')}</span>
                      <input 
                        type="checkbox" 
                        checked={preferences.preferStepFree}
                        onChange={(e) => setPreferences({ ...preferences, preferStepFree: e.target.checked })}
                        className="w-4 h-4 rounded text-blue-600"
                      />
                    </label>

                    <label className="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-900 cursor-pointer">
                      <span className="text-slate-300 font-semibold">{t('outageNotifications')}</span>
                      <input 
                        type="checkbox" 
                        checked={preferences.notifyOutages}
                        onChange={(e) => setPreferences({ ...preferences, notifyOutages: e.target.checked })}
                        className="w-4 h-4 rounded text-blue-600"
                      />
                    </label>
                  </div>
                </div>

              </div>
            )}

            {/* VIEW 2: INTERACTIVE MAP & ROUTE PLANNER */}
            {currentView === 'map' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* Left Side: Route Controls */}
                <div className="lg:col-span-5 space-y-4">
                  
                  {/* Origin / Destination Selector */}
                  <div className="p-5 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                    <h2 className="text-base font-bold flex items-center gap-2 text-white">
                      <Icon name="navigation" className="w-5 h-5 text-blue-400" />
                      {t('routeFinder')}
                    </h2>

                    <div className="space-y-3 text-xs">
                      <StationSearch
                        id="originStationSearch"
                        label={t('startStation')}
                        value={origin}
                        stations={stationOptions}
                        onChange={setOrigin}
                        placeholder={t('searchStart')}
                        t={t}
                      />

                      <StationSearch
                        id="destinationStationSearch"
                        label={t('destinationStation')}
                        value={destination}
                        stations={stationOptions}
                        onChange={setDestination}
                        placeholder={t('searchDestination')}
                        t={t}
                      />
                    </div>
                  </div>

                  {/* Calculated Route Cards */}
                  <div className="space-y-3">
                    {activeJourney && (
                      <div className="p-4 rounded-2xl border border-emerald-700/70 bg-emerald-950/30 space-y-3">
                        <div>
                          <p className="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">
                            {t('journeyInProgress')}
                          </p>
                          <p className="text-sm font-bold text-white mt-1">
                            {stationsData[activeJourney.origin]?.name || activeJourney.origin}
                            <span className="text-slate-500 mx-2">→</span>
                            {stationsData[activeJourney.destination]?.name || activeJourney.destination}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={handleCompleteJourney}
                            className="flex-1 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                          >
                            {t('completeJourney')}
                          </button>
                          <button
                            type="button"
                            onClick={handleCancelJourney}
                            className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs"
                          >
                            {t('cancelJourney')}
                          </button>
                        </div>
                      </div>
                    )}
                    {routeLoading && (
                      <div className="p-4 rounded-2xl border border-blue-900 bg-blue-950/30 text-xs text-blue-300 flex items-center gap-2">
                        <Icon name="loader-circle" className="w-4 h-4" />
                        {t('calculatingRoutes', { count: stationOptions.length })}
                      </div>
                    )}
                    {routeError && !routeLoading && (
                      <div className="p-4 rounded-2xl border border-amber-900 bg-amber-950/30 text-xs text-amber-300">
                        {t(routeError)}
                      </div>
                    )}
                    {routeResults.map((opt) => (
                      <div
                        key={opt.id}
                        onClick={() => setSelectedRouteOption(opt.id)}
                        className={`p-4 rounded-2xl border cursor-pointer transition shadow-lg ${
                          selectedRouteOption === opt.id 
                            ? 'border-blue-500 bg-blue-950/30 ring-1 ring-blue-500/50' 
                            : 'border-slate-800 bg-slate-950/60 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-start justify-between mb-2">
                          <div>
                            <h3 className="font-bold text-sm text-white flex items-center gap-2">
                              {opt.id === 0 ? t('fastestRoute') : t('alternativeRoute', { number: opt.id })}
                              {opt.isAda && <span className="text-[10px] text-blue-400 bg-blue-950 px-1.5 py-0.5 rounded border border-blue-800">♿ {t('accessible')}</span>}
                            </h3>
                            <p className="text-xs text-slate-400 mt-0.5">
                              {opt.duration} {t('mins')} • {t('transferCount', { count: opt.transfers })}
                            </p>
                          </div>
                          <div className="flex items-center space-x-1.5">
                            {opt.lines.map((l, idx) => (
                              <LineBadge 
                                key={idx} 
                                line={l} 
                                isExpress={opt.isExpress ? opt.isExpress[idx] : false} 
                                size="w-6 h-6 text-xs" 
                              />
                            ))}
                          </div>
                        </div>

                        {/* Step Details */}
                        <div className="space-y-1.5 my-3 pl-2 border-l-2 border-slate-800 text-xs text-slate-300">
                          {formatRouteSteps(opt).map((st, i) => (
                            <p key={i} className="flex items-start gap-1.5">
                              <span className="text-slate-500">•</span> {st}
                            </p>
                          ))}
                        </div>

                        {/* Actions */}
                        <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleStartJourney();
                            }}
                            disabled={Boolean(activeJourney)}
                            className="text-[11px] text-emerald-400 hover:underline disabled:text-slate-600 disabled:no-underline flex items-center gap-1 font-semibold"
                          >
                            <Icon name="route" className="w-3.5 h-3.5" /> {t('startJourney')}
                          </button>

                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleSaveRoute(opt);
                            }}
                            className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center gap-1.5 transition shadow"
                          >
                            <Icon name="bookmark" className="w-3.5 h-3.5" />
                            {t('bookmarkRoute')}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Places Near Destination */}
                  <div className="p-5 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                    <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                      <Icon name="map-pin" className="w-4 h-4 text-red-400" />
                      {t('placesNear', { station: stationsData[destination]?.name || '' })}
                    </h2>

                    <div className="space-y-2">
                      {(YELP_VENUES_DATABASE[destination] || YELP_VENUES_DATABASE['127']).map(v => (
                        <div key={v.id} className="p-3 rounded-xl border border-slate-800 bg-slate-900/60 flex items-center justify-between gap-3 text-xs">
                          <div className="flex items-center space-x-3">
                            <span className="text-xl">{v.image}</span>
                            <div>
                              <p className="font-bold text-white">{v.name}</p>
                              <p className="text-[11px] text-slate-400">{v.text}</p>
                            </div>
                          </div>
                          <div className="text-right whitespace-nowrap">
                            <p className="font-bold text-amber-400">★ {v.rating}</p>
                            <p className="text-[10px] text-slate-500">{v.distance}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* Right Side: Map & Live Service Updates */}
                <div className="lg:col-span-7 space-y-4">
                  
                  {/* Interactive Map Header */}
                  <div className="p-4 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <Icon name="map" className="w-4 h-4 text-blue-400" />
                        {t('interactiveMap')}
                      </h2>

                      <button
                        onClick={() => setUseAltMap(!useAltMap)}
                        className="text-xs text-slate-400 hover:text-white underline flex items-center gap-1"
                      >
                        <Icon name="list" className="w-3.5 h-3.5" />
                        {useAltMap ? t('mapView') : t('stationListView')}
                      </button>
                    </div>

                    {!useAltMap ? (
                      <div ref={mapContainerRef} className="h-[440px] w-full rounded-xl border border-slate-800 shadow-inner"></div>
                    ) : (
                      <div className="p-4 rounded-xl border border-slate-800 bg-slate-900 space-y-2 text-xs">
                        <p className="font-bold text-slate-300">{t('stationListView')}:</p>
                        {stationOptions.map(s => (
                          <div key={`alt-${s.id}`} className="p-2 border-b border-slate-800 flex justify-between items-center">
                            <span>{s.name}{s.borough ? ` (${s.borough})` : ''}</span>
                            <div className="flex gap-1 items-center">
                              {s.lines.map((l, i) => (
                                <LineBadge key={i} line={l} size="w-4 h-4 text-[9px]" />
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Live Service Alerts & Elevator Monitor */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    {/* Live GTFS-Realtime train updates */}
                    <div className="p-4 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                      <div className="flex items-center justify-between gap-2">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                          <Icon name="radio" className="w-4 h-4" />
                          {t('liveTrainUpdates')}
                        </h3>
                        <span className="text-[10px] text-emerald-400 font-mono">
                          {t('trips', { count: liveTrainCount })}
                        </span>
                      </div>

                      <div className="space-y-2 text-xs">
                        {liveDataError && (
                          <p className="text-[11px] text-amber-400">{t(liveDataError)}</p>
                        )}
                        {!liveDataError && liveTrains.length === 0 && (
                          <p className="text-[11px] text-slate-500">{t('waitingLive')}</p>
                        )}
                        {liveTrains.slice(0, 4).map((train, index) => (
                          <div key={`${train.tripId || train.routeId}-${index}`} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                            <div className="flex items-center gap-2 font-bold text-white">
                              <LineBadge line={displayRouteId(train.routeId)} size="w-5 h-5 text-[10px]" />
                              <span>{train.nextStop?.stopName || '—'}</span>
                              <span className="ml-auto text-amber-400 font-mono">
                                {formatEpochTime(train.nextStop?.arrivalTime || train.nextStop?.departureTime)}
                              </span>
                            </div>
                            <p className="text-[10px] text-slate-500 font-mono truncate">
                              {t('trip', { id: train.tripId || '—' })}
                            </p>
                          </div>
                        ))}
                        {liveFetchedAt && (
                          <p className="text-[10px] text-slate-600 text-right">
                            {t('updatedAt', { time: new Date(liveFetchedAt).toLocaleTimeString() })}
                          </p>
                        )}
                      </div>
                    </div>

                    {/* Elevator & Escalator Status */}
                    <div className="p-4 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center gap-1.5">
                        <Icon name="accessibility" className="w-4 h-4" />
                        {t('elevatorUpdates')}
                      </h3>

                      <div className="space-y-2 text-xs">
                        {outageError && (
                          <p className="text-[11px] text-amber-400">{t(outageError)}</p>
                        )}
                        {!outageError && outages.length === 0 && (
                          <p className="text-[11px] text-emerald-400">{t('noOutages')}</p>
                        )}
                        {outages.slice(0, 4).map((out, i) => (
                          <div key={`${out.equipmentId || out.equipment || 'outage'}-${i}`} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                            <p className="font-bold text-slate-200">
                              {out.equipment || `${out.equipmentType || 'Equipment'} ${out.equipmentId || ''}`}
                            </p>
                            <p className="text-[10px] text-slate-400">
                              {out.stationName || out.station || 'Station unavailable'}
                            </p>
                            <div className="flex justify-between text-[11px]">
                              <span className="text-red-400 font-semibold">{out.status || out.reason || 'Unavailable'}</span>
                              <span className="text-slate-500">ETA: {out.estimatedReturn || 'Unknown'}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>

                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
