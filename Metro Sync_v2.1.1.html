<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Transit Hub Pro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Persistent journey achievements -->
  <script src="distance-config.js"></script>
  <script src="distance.js"></script>
  <script src="carbon.js"></script>
  <script src="eco-score.js"></script>
  <script src="achievements.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Keep all interface and status icons static for glanceable wayfinding. */
    svg,
    [data-lucide],
    .animate-spin,
    .animate-bounce,
    .animate-pulse {
      animation: none !important;
    }
    .leaflet-container {
      background-color: #0f172a !important;
      font-family: inherit;
      z-index: 10;
      border-radius: 0.75rem;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 0.5rem;
    }
    .leaflet-control-zoom a {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }
    /* Official MTA Line Badge Base Styles */
    .mta-badge-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 700;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .mta-badge-diamond {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      border-radius: 2px;
      font-weight: 700;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .mta-badge-diamond-inner {
      transform: rotate(-45deg);
      display: inline-block;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .leaflet-tooltip.route-stop-label {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
    }
    .leaflet-tooltip-top.route-stop-label::before { border-top-color: #475569; }
    .line-focus .route-layer-label { opacity: 0.2 !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- FIREBASE BACKEND SETUP FOUNDATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    window.dummyFirebaseConfig = {
      apiKey: "AIzaSyDEMO_KEY_REPLACE_WITH_REAL",
      authDomain: "nyc-transit-hub-demo.firebaseapp.com",
      projectId: "nyc-transit-hub-demo",
      storageBucket: "nyc-transit-hub-demo.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    try {
      const app = initializeApp(window.dummyFirebaseConfig);
      window.firebaseAuth = getAuth(app);
      window.firebaseDb = getFirestore(app);
      console.log("Firebase initialized successfully in Demo Mode.");
    } catch (e) {
      console.warn("Firebase running in local fallback mock mode.");
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper Component for Lucide Icons
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.lucide) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            nameAttr: 'data-lucide',
            attrs: { class: className }
          });
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center" {...props} />;
    };

    // Click/tap/keyboard disclosure: rider copy first, calculation details on demand.
    const EcoBadge = ({ score, recommended = false }) => <span className={'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-semibold ' + (recommended ? 'border-emerald-500 bg-emerald-950/60 text-emerald-200' : score > 0 ? 'border-emerald-800 bg-emerald-950/20 text-emerald-200' : 'border-slate-600 bg-slate-900 text-slate-300')}
      aria-label={score == null ? 'Eco score not available' : 'Eco score ' + Math.round(score)}
      title="Eco score: higher means more carbon saved compared with a car ride"><span aria-hidden="true">🌱</span><span>Eco score {score == null ? '—' : Math.round(score)}</span></span>;
    // Display helpers: stored values stay in kg/km; riders see lb/mi by default.
    const KG_TO_LB = 2.20462, KM_TO_MI = 0.621371;
    const formatCarbon = (kg, units) => {
      const value = units === 'metric' ? kg : kg * KG_TO_LB;
      return (value < 1 ? value.toFixed(1) : Math.round(value)) + (units === 'metric' ? ' kg' : ' lb');
    };
    const formatDistance = (km, units) => (units === 'metric' ? km : km * KM_TO_MI).toFixed(1) + (units === 'metric' ? ' km' : ' mi');
    // "A car ride" covers your own car, a cab or a rideshare: many riders don't own a car.
    const carbonSentence = (kg, units) => kg > 0 ? 'About ' + formatCarbon(kg, units) + ' less carbon than a car ride' : 'About the same carbon as a car ride';
    // Everyday comparison for the Eco sheet: US EPA Greenhouse Gas Equivalencies, ~0.0124 kg CO2 per smartphone charge.
    // Rounded so it reads as a rough comparison, not a precise figure.
    const KG_CO2_PER_PHONE_CHARGE = 0.0124;
    const phoneCharges = (kg) => { const n = kg / KG_CO2_PER_PHONE_CHARGE; return n >= 20 ? Math.round(n / 10) * 10 : Math.max(1, Math.round(n)); };
    // Eco explanation as an overlay: a bottom sheet on phones, a centered dialog on larger screens.
    // It never pushes the route cards down.
    const EcoSheet = ({ onClose, children }) => {
      const sheetRef = useRef(null);
      // No body scroll lock: on pages wider than the screen it changes the layout width and pans the view.
      // The sheet scrolls on its own (overscroll-contain) instead.
      // Size the sheet to the visible screen (visualViewport), not the page width, so it never opens partly off-screen.
      const readViewport = () => window.visualViewport ? { left: window.visualViewport.offsetLeft, width: window.visualViewport.width } : null;
      const [viewport, setViewport] = useState(readViewport);
      useEffect(() => {
        sheetRef.current?.querySelector('[data-autofocus]')?.focus({ preventScroll: true });
        const vv = window.visualViewport;
        if (!vv) return;
        const update = () => setViewport(readViewport());
        vv.addEventListener('resize', update); vv.addEventListener('scroll', update);
        return () => { vv.removeEventListener('resize', update); vv.removeEventListener('scroll', update); };
      }, []);
      const onKeyDown = (event) => {
        if (event.key === 'Escape') { event.stopPropagation(); onClose(); return; }
        if (event.key !== 'Tab') return;
        const focusable = sheetRef.current.querySelectorAll('button, summary, select, input, a[href]');
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      };
      return <div className="fixed inset-y-0 z-[60] flex items-end sm:items-center justify-center bg-slate-950/70" onClick={onClose}
        style={viewport ? { left: viewport.left, width: viewport.width } : { left: 0, right: 0 }}>
        <div ref={sheetRef} role="dialog" aria-modal="true" aria-labelledby="eco-sheet-title" onKeyDown={onKeyDown} onClick={e => e.stopPropagation()}
          className="w-full sm:max-w-md max-h-[85vh] overflow-y-auto overscroll-contain rounded-t-2xl sm:rounded-2xl border border-slate-700 bg-slate-900 px-4 pt-3 pb-[max(1rem,env(safe-area-inset-bottom))] space-y-3 text-sm text-slate-300 shadow-2xl">
          <div className="flex items-center justify-between gap-3">
            <h2 id="eco-sheet-title" className="font-bold text-white">🌱 Your Eco score</h2>
            <button data-autofocus type="button" onClick={onClose} aria-label="Close" className="w-11 h-11 -mr-2 flex items-center justify-center rounded-full text-slate-400 text-2xl leading-none hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-400">×</button>
          </div>
          {children}
        </div>
      </div>;
    };
    const EcoInfo = ({ title, headingId, label, compact = false, score, children }) => {
      const [open, setOpen] = useState(false);
      const panelId = React.useId();
      return <div className="space-y-2">
        <div className="flex items-center justify-between gap-3">
          {!compact && <h2 id={headingId} className="font-bold text-white">{title}</h2>}
          <button type="button" aria-label={compact ? label + (score == null ? ': score not available' : ': ' + Math.round(score)) : label}
            title={compact ? 'Eco score for the selected route — tap for details' : label} aria-expanded={open} aria-controls={panelId}
            onClick={() => setOpen(value => !value)}
            className={compact ? 'rounded-full focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-400 hover:brightness-125' : 'w-8 h-8 shrink-0 rounded-full border border-slate-600 text-blue-300 text-lg hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-400'}>
            {compact ? <EcoBadge score={score} /> : 'ⓘ'}
          </button>
        </div>
        {open && <div id={panelId} role="region" aria-label={label} className="p-3 rounded-xl border border-slate-700 bg-slate-900 space-y-2 text-xs text-slate-300">{children}</div>}
      </div>;
    };
    const EcoMethodNotes = () => <div className="space-y-3">
      <h3 className="font-semibold text-white">How we estimate your carbon savings</h3>
      <p>We compare your subway ride with the same trip by car: one rider in a gas car, like a solo cab or rideshare. Don't own a car? Plenty of New Yorkers don't. Your ride still counts. It's an estimate, not an exact measurement.</p>
      <h3 className="font-semibold text-white">What your Eco score means</h3>
      <p>Higher score = more carbon saved. 0 means no saving, and 50 means about 4 lb (2 kg) saved. Longer routes don't add points, and no car is needed to earn it.</p>
      <p>Your trips are saved on this device only.</p>
      <details><summary className="cursor-pointer text-blue-300">Technical details and sources</summary><div className="space-y-3 mt-3">
      <p>Estimated kg CO₂e saved = driving km × {MetroCarbon.FACTORS.carKgPerKm.toFixed(4)} − subway km × {MetroCarbon.FACTORS.subwayKgPerKm.toFixed(4)}. CO₂e includes greenhouse gases expressed as a carbon dioxide equivalent. If the subway route is much longer than the drive, the saving can be zero.</p>
      <p>Subway distances follow MTA GTFS track shapes, excluding walks. Driving distances come from OSRM road routes. Only public station coordinates are sent; we do not use GPS location.</p>
      <p>Factors come from <a className="underline text-blue-300" href={MetroCarbon.FACTORS.source} target="_blank" rel="noopener noreferrer">MTA Climate Sustainability Framework (2023), slide 3</a>, using 2020 averages: 1.12 lb CO₂e/passenger-mile for one person driving a gas car and 0.11 for subway. They are operational averages, not current line-specific measurements or full life-cycle emissions.</p>
      <p>Subway suggestions use normal-service patterns, not live departures or closures. Travel times do not include live waiting. Actual emissions vary with the vehicle, electricity and passenger load. The public road-routing demo may be unavailable.</p>
      <p>Score = 100 × positive kg CO₂e saved / (positive kg CO₂e saved + 2). The 2 kg scale is a product design choice, not a scientific coefficient or certified rating. A longer detour with the same endpoints does not earn extra credit. Missing data is unscored; non-positive savings score zero.</p>
      <p>Phone-charge comparison: about 0.0124 kg CO₂ per smartphone charge, from the U.S. EPA Greenhouse Gas Equivalencies Calculator, rounded to the nearest 10. It's a rough everyday comparison, not an exact equivalent.</p>
      <p>Routes are listed by travel time. The route with the most estimated savings is tagged "Lowest carbon option". Scores are per journey, not cumulative reward points. Selecting a different route does not automatically record a trip.</p>
      <p>Confirm arrival to save the estimate and score. Older records are kept; trips without distance data are not recalculated. Records are saved in this browser only, with no cloud sync.</p>
      </div></details>
    </div>;

    // Official MTA Trunk Line Palette Specs
    const MTA_LINE_COLORS = {
      '1': 'bg-[#EE352E] text-white', '2': 'bg-[#EE352E] text-white', '3': 'bg-[#EE352E] text-white',
      '4': 'bg-[#00933C] text-white', '5': 'bg-[#00933C] text-white', '6': 'bg-[#00933C] text-white',
      'A': 'bg-[#0039A6] text-white', 'C': 'bg-[#0039A6] text-white', 'E': 'bg-[#0039A6] text-white',
      'N': 'bg-[#FCCC0A] text-black font-bold', 'Q': 'bg-[#FCCC0A] text-black font-bold', 'R': 'bg-[#FCCC0A] text-black font-bold', 'W': 'bg-[#FCCC0A] text-black font-bold',
      'B': 'bg-[#FF6319] text-white', 'D': 'bg-[#FF6319] text-white', 'F': 'bg-[#FF6319] text-white', 'M': 'bg-[#FF6319] text-white',
      '7': 'bg-[#B3519E] text-white', 'L': 'bg-[#A7A9AC] text-white', 'G': 'bg-[#6CBE45] text-white', 'J': 'bg-[#996633] text-white', 'Z': 'bg-[#996633] text-white',
      'S': 'bg-[#808183] text-white'
    };

    const HEX_LINE_COLORS = {
      '1': '#EE352E', '2': '#EE352E', '3': '#EE352E',
      '4': '#00933C', '5': '#00933C', '6': '#00933C',
      'A': '#0039A6', 'C': '#0039A6', 'E': '#0039A6',
      'N': '#FCCC0A', 'Q': '#FCCC0A', 'R': '#FCCC0A', 'W': '#FCCC0A',
      'B': '#FF6319', 'D': '#FF6319', 'F': '#FF6319', 'M': '#FF6319',
      '7': '#B3519E', 'L': '#A7A9AC', 'G': '#6CBE45', 'J': '#996633', 'Z': '#996633',
      'S': '#808183'
    };

    const displayRouteId = (routeId) => {
      if (['FS', 'GS', 'H'].includes(routeId)) return 'S';
      if (routeId === 'SI') return 'SIR';
      return String(routeId || '?').replace(/X$/, '');
    };

    const formatEpochTime = (epochSeconds) => {
      if (!epochSeconds) return '--:--';
      return new Date(epochSeconds * 1000).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    // ---- Geometry helpers for following the real track -----------------------
    const SHAPE_KX = 111320 * Math.cos((40.73 * Math.PI) / 180);
    const SHAPE_KY = 110540;

    // Closest point of a [lon, lat] polyline to a location: its position along
    // the line (vertex index + fraction) and the distance in metres.
    const projectOnShape = (coords, lon, lat) => {
      let bestDist = Infinity;
      let bestPos = 0;
      const px = lon * SHAPE_KX;
      const py = lat * SHAPE_KY;
      for (let i = 0; i < coords.length - 1; i += 1) {
        const ax = coords[i][0] * SHAPE_KX;
        const ay = coords[i][1] * SHAPE_KY;
        const dx = coords[i + 1][0] * SHAPE_KX - ax;
        const dy = coords[i + 1][1] * SHAPE_KY - ay;
        const len2 = dx * dx + dy * dy;
        const frac = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
        const dist = Math.hypot(px - (ax + frac * dx), py - (ay + frac * dy));
        if (dist < bestDist) {
          bestDist = dist;
          bestPos = i + frac;
        }
      }
      return { dist: bestDist, pos: bestPos };
    };

    // [lat, lon] points of a polyline between two positions (either order).
    const sliceShape = (coords, from, to) => {
      const pointAt = (pos) => {
        const i = Math.min(Math.floor(pos), coords.length - 2);
        const t = pos - i;
        return [
          coords[i][1] + (coords[i + 1][1] - coords[i][1]) * t,
          coords[i][0] + (coords[i + 1][0] - coords[i][0]) * t
        ];
      };
      const out = [pointAt(from)];
      if (from <= to) {
        for (let i = Math.floor(from) + 1; i <= Math.floor(to); i += 1) out.push([coords[i][1], coords[i][0]]);
      } else {
        for (let i = Math.ceil(from) - 1; i >= Math.ceil(to); i -= 1) out.push([coords[i][1], coords[i][0]]);
      }
      out.push(pointAt(to));
      return out;
    };

    // The stretch of the line's real shape that a ride covers, or null when no
    // shape fits all of its stops (then the caller draws straight segments).
    const followTrack = (stops, line, shapeFeatures) => {
      if (!shapeFeatures || stops.length < 2) return null;
      let best = null;
      for (const feature of shapeFeatures) {
        if (displayRouteId(feature.properties.route_id) !== line) continue;
        const coords = feature.geometry.coordinates;
        const positions = [];
        let total = 0;
        let fits = true;
        for (const stop of stops) {
          const { dist, pos } = projectOnShape(coords, stop.lon, stop.lat);
          if (dist > 150) { fits = false; break; }
          total += dist;
          positions.push(pos);
        }
        if (!fits) continue;
        const first = positions[0];
        const last = positions[positions.length - 1];
        if (first === last) continue;
        const sign = last > first ? 1 : -1;
        const monotonic = positions.every((pos, i) => i === 0 || sign * (pos - positions[i - 1]) >= -2);
        if (!monotonic) continue;
        if (!best || total < best.total) best = { coords, first, last, total };
      }
      return best ? sliceShape(best.coords, best.first, best.last) : null;
    };

    const ROUTE_REASON_KEYS = {
      origin_not_accessible: 'originNotAccessible',
      destination_not_accessible: 'destinationNotAccessible',
      no_accessible_route: 'noAccessibleRoute',
      accessibility_data_unavailable: 'accessibilityUnavailable'
    };

    const lineColor = (id, feature) =>
      feature?.properties?.route_color || HEX_LINE_COLORS[id] || '#808080';

    // Straight-line walking distance between two stations, rounded for display.
    const formatWalkDistance = (meters) => {
      if (!meters) return '';
      if (meters >= 1000) return `${(meters / 1000).toFixed(1)} km`;
      return `${Math.max(10, Math.round(meters / 10) * 10)} m`;
    };

    // VS Code Live Server normally serves this file on port 5500 while the
    // Express API runs on port 5000. Detect that local-development setup so
    // API calls do not get sent to Live Server and return 404.
    const API_BASE_URL = (() => {
      const localHosts = ['localhost', '127.0.0.1', '::1', '[::1]'];
      const isLocal = localHosts.includes(window.location.hostname);
      if (window.location.protocol === 'file:') return 'http://localhost:5000';
      if (isLocal && window.location.port !== '5000') return 'http://localhost:5000';
      return '';
    })();
    const apiUrl = (path) => `${API_BASE_URL}${path}`;

    // MTA Line Badge Component (Supports Circle vs Express Diamond Badges)
    const LineBadge = ({ line, isExpress = false, size = "w-5 h-5 text-[10px]" }) => {
      const colorClass = MTA_LINE_COLORS[line] || 'bg-slate-700 text-white';

      if (isExpress) {
        return (
          <span 
            className={`mta-badge-diamond ${size} ${colorClass}`}
            aria-label={`${line} Express Line`}
          >
            <span className="mta-badge-diamond-inner">{line}</span>
          </span>
        );
      }

      return (
        <span 
          className={`mta-badge-circle ${size} ${colorClass}`}
          aria-label={`${line} Local Line`}
        >
          {line}
        </span>
      );
    };

    const normalizeStationSearch = (value) =>
      String(value || '')
        .toLowerCase()
        .replace(/\bsquare\b/g, 'sq')
        .replace(/\bstreet\b/g, 'st')
        .replace(/\bavenue\b/g, 'av')
        .replace(/\bcenter\b/g, 'ctr')
        .replace(/\bsaint\b/g, 'st')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');

    const stationSearchScore = (station, query) => {
      const normalizedQuery = normalizeStationSearch(query);
      const stationName = normalizeStationSearch(station.name);
      const stationId = normalizeStationSearch(station.id);
      if (!normalizedQuery) return 0;
      if (stationId === normalizedQuery || stationName === normalizedQuery) return 0;
      if (stationId.startsWith(normalizedQuery)) return 2;
      if (stationName.startsWith(normalizedQuery)) return 4;
      const substringIndex = stationName.indexOf(normalizedQuery);
      if (substringIndex >= 0) return 10 + substringIndex / 1000;

      let queryIndex = 0;
      let gaps = 0;
      let lastMatch = -1;
      for (let index = 0; index < stationName.length; index++) {
        if (stationName[index] !== normalizedQuery[queryIndex]) continue;
        if (lastMatch >= 0) gaps += index - lastMatch - 1;
        lastMatch = index;
        queryIndex++;
        if (queryIndex === normalizedQuery.length) return 30 + gaps;
      }
      return Number.POSITIVE_INFINITY;
    };

    const StationSearch = ({ id, label, value, stations, onChange, placeholder, t }) => {
      const selectedStation = stations.find((station) => station.id === value);
      const [query, setQuery] = useState(selectedStation?.name || '');
      const [isOpen, setIsOpen] = useState(false);
      const [activeIndex, setActiveIndex] = useState(0);
      const blurTimerRef = useRef(null);

      useEffect(() => {
        setQuery(selectedStation?.name || '');
      }, [value, selectedStation?.name]);

      const results = useMemo(() => {
        const showAll =
          normalizeStationSearch(query) ===
          normalizeStationSearch(selectedStation?.name || '');
        const ranked = stations
          .map((station) => ({
            station,
            score: showAll ? 0 : stationSearchScore(station, query)
          }))
          .filter((item) => Number.isFinite(item.score))
          .sort(
            (a, b) =>
              a.score - b.score || a.station.name.localeCompare(b.station.name)
          )
          .slice(0, 12)
          .map((item) => item.station);
        return ranked;
      }, [stations, query, selectedStation?.name]);

      const chooseStation = (station) => {
        onChange(station.id);
        setQuery(station.name);
        setActiveIndex(0);
        setIsOpen(false);
      };

        if (event.key === 'ArrowDown') {
          event.preventDefault();
          setIsOpen(true);
          setActiveIndex((current) => Math.min(current + 1, Math.max(0, results.length - 1)));
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          setActiveIndex((current) => Math.max(current - 1, 0));
        } else if (event.key === 'Enter' && isOpen && results[activeIndex]) {
          event.preventDefault();
          chooseStation(results[activeIndex]);
        } else if (event.key === 'Escape') {
          setIsOpen(false);
          setQuery(selectedStation?.name || '');
        }
      };

          <label htmlFor={id} className="block text-slate-400 font-semibold mb-1">{label}</label>

              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded={isOpen}
              aria-controls={`${id}-results`}
              autoComplete="off"
              value={query}
              placeholder={placeholder}
              onFocus={() => {
                clearTimeout(blurTimerRef.current);
                setIsOpen(true);
                setActiveIndex(0);
              }}
              onChange={(event) => {
                setQuery(event.target.value);
                setIsOpen(true);
                setActiveIndex(0);
              }}
              onBlur={() => {
                blurTimerRef.current = setTimeout(() => {
                  setIsOpen(false);
                  setQuery(selectedStation?.name || '');
                }, 150);
              }}
              onKeyDown={handleKeyDown}
              className="w-full p-2.5 pl-9 rounded-xl border border-slate-700 bg-slate-900 text-white font-medium focus:outline-none focus:border-blue-500"
            />

              <div
                id={`${id}-results`}
                role="listbox"
                className="absolute z-30 mt-1 w-full max-h-64 overflow-y-auto rounded-xl border border-slate-700 bg-slate-950 shadow-2xl"

                    onMouseDown={(event) => event.preventDefault()}
                    onClick={() => chooseStation(station)}
                    onMouseEnter={() => setActiveIndex(index)}
                    className={`w-full text-left px-3 py-2 border-b last:border-b-0 border-slate-800 ${
                      index === activeIndex ? 'bg-blue-600/25 text-white' : 'text-slate-300 hover:bg-slate-900'
                    }`}

                    <span className="block text-xs font-semibold">{station.name}</span>
                    <span className="block text-[10px] text-slate-500 font-mono">
                      {station.lines?.join(' · ') || station.id}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      );

      const q = query.toLowerCase().trim();
      const originSt = stationsData[currentOrigin];
      const destSt = stationsData[currentDest];

      if (q.includes("step-free") || q.includes("elevator") || q.includes("wheelchair") || q.includes("ada") || q.includes("accessible")) {
        const origAda = originSt?.ada ? "step-free accessible ♿" : "NOT step-free ⚠️";
        const destAda = destSt?.ada ? "step-free accessible ♿" : "NOT step-free ⚠️";
        return `Accessibility Check: ${originSt?.name || 'Origin'} is ${origAda}. ${destSt?.name || 'Destination'} is ${destAda}. For active equipment outages, check the Elevator Updates card.`;

      if (q.includes("delay") || q.includes("alert") || q.includes("status") || q.includes("service") || q.includes("train")) {

      if (q.includes("food") || q.includes("coffee") || q.includes("pizza") || q.includes("eat") || q.includes("near") || q.includes("place")) {
        const venues = YELP_VENUES_DATABASE[currentDest] || YELP_VENUES_DATABASE['127'];
        const top = venues[0];
        return `Top recommendation near ${destSt?.name || 'destination'}: ${top.name} (${top.image} ${top.price}, ${top.distance}) - ${top.text}`;
      }
      if (q.includes("transfer") || q.includes("route") || q.includes("fast") || q.includes("how to get")) {
        const fastest = currentRoutes?.[0];
        if (fastest) {

        return `Commute Guidance: Select an origin and destination to calculate a route from the live station graph.`;

    const interpolate = (template, values = {}) =>
      String(template).replace(/\{(\w+)\}/g, (_, key) =>
        values[key] !== undefined ? values[key] : `{${key}}`
      );

    const LANGUAGE_STORAGE_KEY = 'nyc_transit_language';
    const getSavedLanguage = () => {
      try {
        const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        return LANGUAGE_OPTIONS.some((option) => option.code === saved) ? saved : 'en';
      } catch (_error) {
        return 'en';
      }
    };
    const persistLanguage = (language) => {
      try {
        localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
      } catch (_error) {
        // Storage may be blocked by browser tracking prevention. The current
        // session still changes language, but it will not persist after reload.
      }
    };

    const PREFERENCES_STORAGE_KEY = 'nyc_transit_preferences_v1';
    const ACHIEVEMENTS_STORAGE_KEY = 'metro_sync_achievements_v1';
    const SESSION_STORAGE_KEY = 'nyc_transit_session_v1';

    const readStoredJson = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_error) {
        return fallback;
      }
    };

    const writeStoredJson = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_error) {
        // The current session remains usable when browser storage is blocked.
      }
    };

    const getSavedPreferences = () =>
      readStoredJson(PREFERENCES_STORAGE_KEY, {
        preferStepFree: true,
        notifyOutages: true,
        maxTransfers: 2,
        ecoGamification: true
      });

    const getSavedSession = () => readStoredJson(SESSION_STORAGE_KEY, null);

    const getSavedAchievements = () => {
      const achievements = globalThis.MetroAchievements;
      return achievements.normalize(
        readStoredJson(ACHIEVEMENTS_STORAGE_KEY, null)
      );
    };

    const LEGACY_STATIONS = { CPS:'125', TSQ:'127', HUDSON:'726', PENN:'128', HERALD:'D17', GCT:'631', UNION:'635', WTC:'E01', FULTON:'229', BARC:'235' };
    const stationId = id => LEGACY_STATIONS[id] || id;

    function App() {
      // Navigation State
      const [currentView, setCurrentView] = useState('map');

      // Accessibility Controls
      const [highContrast, setHighContrast] = useState(false);
      const [useAltMap, setUseAltMap] = useState(false);
      // false: only the selected route is drawn; true: the whole network is drawn.
      const [showAllLines, setShowAllLines] = useState(false);
      const [activeLine, setActiveLine] = useState(null);
      const [expandedRouteId, setExpandedRouteId] = useState(null);
      const [mapVersion, setMapVersion] = useState(0);

      // User Sign-In State
      const [currentUser, setCurrentUser] = useState(() =>
        getSavedSession() || {
          isLoggedIn: false,
          email: '',
          displayName: ''
        }
      );
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'forgot'
      const [authName, setAuthName] = useState('');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authConfirmPassword, setAuthConfirmPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [authNotice, setAuthNotice] = useState('');

      // Route Planner State
      const [origin, setOrigin] = useState(() => stationId(getSavedAchievements().active?.origin || '127'));
      const [destination, setDestination] = useState(() => stationId(getSavedAchievements().active?.destination || '235'));
      const [selectedRouteOption, setSelectedRouteOption] = useState(0);
      const [routeResults, setRouteResults] = useState([]);

      // Saved Favorite Routes
      const [savedRoutes, setSavedRoutes] = useState(() => {
        try {
          const stored = localStorage.getItem('nyc_transit_saved_routes');
          return stored ? JSON.parse(stored).filter(r => r && Array.isArray(r.lines)).map(r => ({ ...r, originId: stationId(r.originId), destId: stationId(r.destId) })) : [
            {
              id: 101,
              nickname: 'Daily Work Commute',
              originId: '127',
              destId: '235',
              originName: 'Times Sq - 42 St',
              destName: 'Atlantic Av - Barclays Ctr',
              lines: ['N', 'Q'],
              duration: 18
            }
          ];
        } catch (e) {
          return [];
        }
      });
      const [editingId, setEditingId] = useState(null);
      const [editNameText, setEditNameText] = useState('');

      // User Preferences
      const [preferences, setPreferences] = useState(getSavedPreferences);
      const [journeyProgress, setJourneyProgress] = useState(getSavedAchievements);
      const [toastMsg, setToastMsg] = useState('');

      // --- De-coupled Offline Assistant State ("What-If" Feature Toggle Ready) ---
      const [isAssistantOpen, setIsAssistantOpen] = useState(false);
      const [assistantInput, setAssistantInput] = useState('');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [assistantMessages, setAssistantMessages] = useState([
        { id: 1, sender: 'bot', text: 'Hello! I am your Offline NYC Transit Assistant. Ask me about delays, elevator accessibility, or places near your stop.' }
      ]);

      // Network Listener for Online/Offline state
      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // Generic Map References
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const polylineRef = useRef(null);
      const markersGroupRef = useRef(null);
      const networkRef = useRef(null);
      const lineDetailRef = useRef(null);
      const fittedRouteRef = useRef({ route: null, map: null });

      const [lang, setLang] = useState(getSavedLanguage);
      const [draftLanguage, setDraftLanguage] = useState(getSavedLanguage);
      const [geoData, setGeoData] = useState({ lines: null, stations: null, lineStops: null });
      const [stationsData, setStationsData] = useState(STATIONS_FALLBACK);
      const [liveTrains, setLiveTrains] = useState([]);
      const [liveTrainCount, setLiveTrainCount] = useState(0);
      const [liveFetchedAt, setLiveFetchedAt] = useState(null);
      const [liveDataError, setLiveDataError] = useState('');
      const [outages, setOutages] = useState([]);
      const [outagesLoaded, setOutagesLoaded] = useState(false);
      const [upcomingOutageCount, setUpcomingOutageCount] = useState(0);
      const [serverOffline, setServerOffline] = useState(false);
      const [basemapFailed, setBasemapFailed] = useState(false);
      const [outageError, setOutageError] = useState('');
      const [routeLoading, setRouteLoading] = useState(false);
      const [routeError, setRouteError] = useState('');
      const [accessibleOnly, setAccessibleOnly] = useState(false);
      const [serviceDay, setServiceDay] = useState(null);
      const t = (key, values) =>
        interpolate(
          FEATURE_TRANSLATIONS[lang]?.[key] ??
            FEATURE_TRANSLATIONS.en[key] ??
            TRANSLATIONS[lang]?.[key] ??
            TRANSLATIONS.en[key] ??
            key,
          values
        );
      const stationOptions = useMemo(
        () => Object.values(stationsData).sort((a, b) => a.name.localeCompare(b.name)),
        [stationsData]
      );
      const achievementStats = useMemo(
        () => globalThis.MetroAchievements.stats(journeyProgress),
        [journeyProgress]
      );
      const activeJourney = journeyProgress.active;
      const carbonSummary = MetroCarbon.summarize(journeyProgress.trips);
      const ecoMetrics = { co2SavedKg: carbonSummary.estimatedJourneys ? carbonSummary.savingsKgCO2e : null };
      // Display units only ('us' = lb/mi, 'metric' = kg/km); saved trip data stays in kg/km.
      const [units, setUnits] = useState(() => {
        // A saved choice wins; otherwise US English browsers get lb/mi and everyone else (e.g. visitors) gets kg/km.
        const fromBrowser = (navigator.language || 'en-US').toLowerCase() === 'en-us' ? 'us' : 'metric';
        try { const saved = localStorage.getItem('metro_sync_units'); return saved === 'metric' || saved === 'us' ? saved : fromBrowser; } catch { return fromBrowser; }
      });
      // Only remember units when the rider picks them, so the browser-language default keeps working until then.
      const chooseUnits = (value) => { setUnits(value); try { localStorage.setItem('metro_sync_units', value); } catch {} };
      // Eco explanation sheet; focus returns to the button that opened it.
      const [ecoSheetOpen, setEcoSheetOpen] = useState(false);
      const ecoSheetTriggerRef = useRef(null);
      const openEcoSheet = (event) => { ecoSheetTriggerRef.current = event.currentTarget; setEcoSheetOpen(true); };
      const closeEcoSheet = () => { setEcoSheetOpen(false); setTimeout(() => ecoSheetTriggerRef.current?.focus(), 0); };

        polylineRef.current.eachLayer((layer) => {
          if (!layer.setStyle) return;
          if (!layer.options.baseStyle) {
            layer.options.baseStyle = {
              opacity: layer.options.opacity,
              fillOpacity: layer.options.fillOpacity
            };
          }
          const base = layer.options.baseStyle;
          layer.setStyle({
            opacity: dim ? base.opacity * 0.2 : base.opacity,
            fillOpacity: dim ? (base.fillOpacity ?? 1) * 0.2 : base.fillOpacity
          });
        });
      }, [effectiveActiveLine, routeResults, selectedRouteOption, mapVersion, showNetwork]);

      // Sign-In Handlers
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const email = authEmail.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setAuthNotice(t('validEmailRequired'));
          return;
        }

        if (authMode === 'forgot') {
          setAuthNotice(t('resetSent', { email }));
          setTimeout(() => {
            setAuthMode('login');
            setAuthNotice('');
          }, 2500);
          return;
        }

        if (authPassword.length < 8) {
          setAuthNotice(t('passwordLength'));
          return;
        }

        if (authMode === 'signup') {
          if (!authName.trim()) {
            setAuthNotice(t('nameRequired'));
            return;
          }
          if (authPassword !== authConfirmPassword) {
            setAuthNotice(t('passwordsMismatch'));
            return;
          }
        }

        const displayName = authName.trim() || email.split('@')[0];
        const nextUser = {
          isLoggedIn: true,
          email,
          displayName
        };
        setCurrentUser(nextUser);
        if (rememberMe) {
          writeStoredJson(SESSION_STORAGE_KEY, nextUser);
        } else {
          try {
            localStorage.removeItem(SESSION_STORAGE_KEY);
          } catch (_error) {
            // Storage may be unavailable under strict browser privacy settings.
          }
        }
        showToast(t('welcomeUser', { email }));
        setIsAuthModalOpen(false);
        setAuthNotice('');
      };

      const handleSignOut = () => {
        setCurrentUser({ isLoggedIn: false, email: '', displayName: '' });
        try {
          localStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (_error) {
          // Storage may be unavailable under strict browser privacy settings.
        }
        showToast(t('signedOut'));
      };

      // Favorite Route Handlers
      const handleSaveRoute = (opt) => {
        const startSt = stationsData[origin];
        const endSt = stationsData[destination];

        const newRoute = {
          id: Date.now(),
          nickname: `${startSt.name} ➔ ${endSt.name}`,
          originId: origin,
          destId: destination,
          originName: startSt.name,
          destName: endSt.name,
          lines: opt.lines,
          duration: opt.duration
        };

        setSavedRoutes(prev => [newRoute, ...prev]);
        setJourneyProgress((current) =>
          globalThis.MetroAchievements.bookmark(current, new Date().toISOString())
        );
        showToast(t('routeSaved'));
      };

      const handleStartEdit = (fav) => {
        setEditingId(fav.id);
        setEditNameText(fav.nickname);
      };

      const handleSaveEdit = (id) => {
        setSavedRoutes(prev => prev.map(r => r.id === id ? { ...r, nickname: editNameText } : r));
        setEditingId(null);
        showToast(t('routeNameUpdated'));
      };

      const handleDeleteRoute = (id) => {
        setSavedRoutes(prev => prev.filter(r => r.id !== id));
        showToast(t('routeRemoved'));
      };

      const handleLoadRoute = (fav) => {
        changeStation('origin', stationId(fav.originId));
        changeStation('destination', stationId(fav.destId));
        setCurrentView('map');
        showToast(t('routeLoaded', { name: fav.nickname }));
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleSaveLanguage = () => {
        setLang(draftLanguage);
        persistLanguage(draftLanguage);
        showToast(
          interpolate(TRANSLATIONS[draftLanguage]?.languageSaved || TRANSLATIONS.en.languageSaved)
        );
      };

      const handleStartJourney = (optionId = selectedRouteOption) => {
        const itinerary = measuredRoutes.find(r => r.id === optionId && r.originId === origin && r.destinationId === destination);
        const estimate = distanceMode === 'manual'
          ? optionId === selectedRouteOption ? carbonEstimate : { status: 'unavailable', reason: 'Manual distances belong to another selected route.' }
          : roadIsCurrent && roadState.status === 'ready'
            ? MetroCarbon.estimateAutomatic(itinerary, roadState.data, comparisonMode)
            : { status: 'unavailable', reason: 'Distances were not available when this journey started.' };
        const journeyId =
          globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
        setJourneyProgress((current) =>
          ({ ...globalThis.MetroAchievements.start(current, origin, destination, journeyId), active: { id: journeyId, origin, destination, carbon: MetroCarbon.snapshot(MetroEcoScore.attach(estimate)) } })
        );
        showToast(t('journeyStarted'));
      };

      const handleCompleteJourney = () => {
        const now = new Date().toISOString();
        const previous = journeyProgress;
        const next = globalThis.MetroAchievements.complete(previous, now, previous.active?.carbon || { status: 'unavailable', reason: 'This journey started before distance estimates were recorded.' });
        setJourneyProgress(next);
        const newlyUnlocked = globalThis.MetroAchievements.definitions.filter(
          (definition) =>
            !previous.unlocked[definition.id] && next.unlocked[definition.id]
        );
        if (newlyUnlocked.length > 0) {
          showToast(
            t('achievementUnlocked', {
              name: achievementCopy(newlyUnlocked[0], 'name')
            })
          );
        } else {
          showToast(t('journeyCompleted'));
        }
      };

      const handleCancelJourney = () => {
        setJourneyProgress((current) =>
          globalThis.MetroAchievements.cancel(current)
        );
      };

      // Assistant Message Submission
      const handleSendAssistantMsg = (userText) => {
        const textToProcess = userText || assistantInput;
        if (!textToProcess.trim()) return;

        const userMsgObj = { id: Date.now(), sender: 'user', text: textToProcess };
        const responseText = runOfflineAssistantQuery(textToProcess, origin, destination, stationsData, routeResults);
        const botMsgObj = { id: Date.now() + 1, sender: 'bot', text: responseText };

        setAssistantMessages(prev => [...prev, userMsgObj, botMsgObj]);
        setAssistantInput('');
      };

      const formatRouteSteps = (route) => {
        if (!Array.isArray(route.segments)) return route.steps || [];
        const steps = [];
        route.segments.forEach((segment) => {
          const minutes = Math.max(1, Math.round(segment.durationSeconds / 60));
          if (segment.kind === 'subway') {
            steps.push(t('rideRoute', {
              line: segment.line,
              from: segment.fromName,
              to: segment.toName,
              minutes,
              stops: Math.max(1, (segment.stopIds?.length || 2) - 1)
            }));
          } else if (segment.fromName !== segment.toName) {
            steps.push(t('transferWalk', {
              from: segment.fromName,
              to: segment.toName,
              minutes
            }));
          }
        });
        steps.push(t('arriveAt', {
          station: stationsData[destination]?.name || route.destinationId
        }));
        return steps;
      };

      // Expandable itinerary: every stop on each ride plus walking transfers.
      const renderRouteDetails = (route) => {
        const segments = route.segments || [];
        const lastIndex = segments.length - 1;
        let rideCounter = 0;
        let hasDistance = false;

        const rows = segments.map((segment, index) => {
          const minutes = Math.max(1, Math.round(segment.durationSeconds / 60));

          if (segment.kind === 'subway') {
            const stops = segment.stops?.length
              ? segment.stops
              : (segment.stopIds || []).map((id) => ({ id, name: id }));
            const color = HEX_LINE_COLORS[segment.line] || '#3b82f6';
            const isExpress = Boolean(route.isExpress?.[rideCounter]);
            rideCounter += 1;
            return (
              <div key={`ride-${index}`}>
                <div className="flex items-center gap-2 text-xs font-bold text-white">
                  <LineBadge line={segment.line} isExpress={isExpress} size="w-5 h-5 text-[10px]" />
                  <span>{t('rideSummary', { stops: Math.max(1, stops.length - 1), minutes })}</span>
                </div>
                <ol className="mt-2 ml-2.5 pl-4 border-l-4 space-y-1.5 text-[11px]" style={{ borderColor: color }}>
                  {stops.map((stop, i) => {
                    const isEnd = i === 0 || i === stops.length - 1;
                    return (
                      <li key={`${stop.id}-${i}`} className={`relative ${isEnd ? 'font-bold text-white' : 'text-slate-300'}`}>
                        <span className="absolute -left-[23px] top-1 w-2.5 h-2.5 rounded-full bg-slate-950 border-2" style={{ borderColor: color }} />
                        {stop.name}
                        {i === 0 && <span className="ml-1.5 text-[10px] font-semibold text-emerald-400">{t('boardHere')}</span>}
                        {i === stops.length - 1 && <span className="ml-1.5 text-[10px] font-semibold text-red-400">{t('alightHere')}</span>}
                      </li>
                    );
                  })}
                </ol>
              </div>
            );
          }

          const sameStation = segment.fromName === segment.toName;
          const distance = formatWalkDistance(segment.distanceMeters);
          // Walking to/from the platform inside one station is not worth a row.
          // A same-station change is only shown between two rides; platform
          // access next to a transfer walk is already covered by that walk.
          if (
            sameStation && !distance &&
            !(segments[index - 1]?.kind === 'subway' && segments[index + 1]?.kind === 'subway')
          ) return null;
          if (distance) hasDistance = true;
          let text;
          if (sameStation && distance) {
            text = t('walkWithin', { station: segment.fromName, distance, minutes });
          } else if (sameStation) {
            text = t('changeAt', { station: segment.fromName, minutes });
          } else if (distance) {
            text = t('walkDetail', { from: segment.fromName, to: segment.toName, distance, minutes });
          } else {
            text = t('transferWalk', { from: segment.fromName, to: segment.toName, minutes });
          }
          return (
            <div key={`walk-${index}`} className="flex items-start gap-2 px-2.5 py-2 rounded-lg border border-dashed border-slate-600 bg-slate-900/60 text-[11px] text-slate-200">
              <Icon name="footprints" className="w-4 h-4 text-slate-400 mt-0.5" />
              <span>{text}</span>
            </div>
          );
        });

        return (
          <div className="space-y-3 mb-3 p-3 rounded-xl bg-slate-950/70 border border-slate-800">
            {rows}
            {hasDistance && <p className="text-[10px] text-slate-500">{t('walkDistanceNote')}</p>}
          </div>
        );
      };

      return (
        <div className={`min-h-screen transition-colors duration-200 ${highContrast ? 'bg-black text-yellow-300 font-mono' : 'bg-slate-900 text-slate-100 font-sans'}`}>

          {/* Notification Toast */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-blue-600 text-white px-5 py-3.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2.5 border border-blue-400">
              <Icon name="bookmark" className="w-4 h-4" />
              {toastMsg}
            </div>
          )}

          {/* Offline Assistant Floating Trigger Button */}
          <button
            onClick={() => setIsAssistantOpen(!isAssistantOpen)}
            className="fixed bottom-6 left-6 z-40 bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-full shadow-2xl flex items-center gap-2 font-bold text-xs border border-blue-400 transition hover:scale-105"
            title={t('offlineAssistant')}
          >
            <Icon name="message-square" className="w-5 h-5" />
            <span className="hidden sm:inline">{t('offlineAssistant')}</span>
          </button>

          {/* Offline Assistant Drawer */}
          {isAssistantOpen && (
            <div className="fixed bottom-20 left-6 z-50 w-80 sm:w-96 bg-slate-950 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col space-y-0">
              <div className="bg-slate-900 p-3.5 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <div className="w-7 h-7 rounded-lg bg-blue-600/30 text-blue-400 border border-blue-500 flex items-center justify-center font-bold text-xs">
                    AI
                  </div>
                  <div>
                    <p className="font-bold text-xs text-white">{t('transitAssistant')}</p>
                    <p className="text-[10px] text-emerald-400 flex items-center gap-1">
                      <span>⚡ {isOnline ? t('onlineSync') : t('offlineMode')}</span>
                    </p>
                  </div>
                </div>
                <button onClick={() => setIsAssistantOpen(false)} className="text-slate-400 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>

              {/* Chat Message History */}
              <div className="p-3 h-64 overflow-y-auto space-y-2 text-xs bg-slate-900/40">
                {assistantMessages.map(m => (
                  <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] p-2.5 rounded-xl ${
                      m.sender === 'user' 
                        ? 'bg-blue-600 text-white rounded-br-none' 
                        : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              {/* Quick Action Chips */}
              <div className="p-2 bg-slate-950 border-t border-slate-800 flex flex-wrap gap-1">
                <button onClick={() => handleSendAssistantMsg("Is route step-free accessible?")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700">
                  ♿ {t('stepFreeAccess')}
                </button>
                <button onClick={() => handleSendAssistantMsg("Check subway delays")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700">
                  ⚠️ {t('checkDelays')}
                </button>
                <button onClick={() => handleSendAssistantMsg("Food near stop")} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700">
                  🍕 {t('nearbyFood')}
                </button>
              </div>

              {/* Input Form */}
              <form onSubmit={(e) => { e.preventDefault(); handleSendAssistantMsg(); }} className="p-2 bg-slate-950 border-t border-slate-800 flex items-center gap-2">
                <input 
                  type="text"
                  value={assistantInput}
                  onChange={(e) => setAssistantInput(e.target.value)}
                  placeholder={t('askAssistant')}
                  className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                />
                <button type="submit" className="p-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs">
                  <Icon name="send" className="w-3.5 h-3.5" />
                </button>
              </form>
            </div>
          )}

          {/* Account Modal */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative space-y-4">
                <button
                  onClick={() => setIsAuthModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <div className="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold border border-blue-500/30">
                    MTA
                  </div>
                  <h3 className="text-lg font-bold text-white">
                    {authMode === 'login' && t('signInTitle')}
                    {authMode === 'signup' && t('signUpTitle')}
                    {authMode === 'forgot' && t('forgotTitle')}
                  </h3>
                  <p className="text-xs text-slate-400">
                    {authMode === 'login' && t('signInDesc')}
                    {authMode === 'signup' && t('signUpDesc')}
                    {authMode === 'forgot' && t('forgotDesc')}
                  </p>
                </div>

                {authNotice && (
                  <div className="p-3 bg-blue-950/60 border border-blue-500/40 rounded-xl text-xs text-blue-300 text-center font-medium">
                    {authNotice}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">{t('fullName')}</label>
                      <input
                        type="text"
                        required
                        value={authName}
                        onChange={(e) => setAuthName(e.target.value)}
                        placeholder="Ada Lovelace"
                        autoComplete="name"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">{t('emailAddress')}</label>
                    <input 
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      placeholder="rider@example.com"
                      autoComplete="email"
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  {authMode !== 'forgot' && (
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">{t('password')}</label>
                      <input 
                        type="password"
                        required
                        minLength={8}
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        placeholder="••••••••"
                        autoComplete={authMode === 'signup' ? 'new-password' : 'current-password'}
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                      />
                      {authMode === 'signup' && (
                        <p className="text-[11px] text-slate-500 mt-1">{t('passwordHint')}</p>
                      )}
                    </div>
                  )}

                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">{t('confirmPassword')}</label>
                      <input
                        type="password"
                        required
                        minLength={8}
                        value={authConfirmPassword}
                        onChange={(e) => setAuthConfirmPassword(e.target.value)}
                        placeholder="••••••••"
                        autoComplete="new-password"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  )}

                  {authMode === 'login' && (
                    <label className="flex items-center gap-2 text-slate-300 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={rememberMe}
                        onChange={(e) => setRememberMe(e.target.checked)}
                        className="w-4 h-4 rounded text-blue-600"
                      />
                      {t('rememberMe')}
                    </label>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg transition"
                  >
                    {authMode === 'login' && t('signIn')}
                    {authMode === 'signup' && t('createAccount')}
                    {authMode === 'forgot' && t('sendReset')}
                  </button>
                </form>

                <div className="pt-2 border-t border-slate-800 text-center text-xs text-slate-400 flex justify-center gap-4">
                  {authMode === 'login' ? (
                    <>
                      <button onClick={() => { setAuthMode('signup'); setAuthNotice(''); }} className="hover:text-white underline">{t('needAccount')}</button>
                      <button onClick={() => { setAuthMode('forgot'); setAuthNotice(''); }} className="hover:text-white underline">{t('forgotPassword')}</button>
                    </>
                  ) : (
                    <button onClick={() => { setAuthMode('login'); setAuthNotice(''); }} className="hover:text-white underline">{t('backSignIn')}</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Top Header */}
          <header className={`border-b ${highContrast ? 'border-yellow-400 bg-black' : 'border-slate-800 bg-slate-950/90'} backdrop-blur sticky top-0 z-40`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl shadow-lg ${highContrast ? 'bg-yellow-400 text-black' : 'bg-blue-600 text-white'}`}>
                  MTA
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    NYC Transit Hub Pro
                    <span className="text-[10px] uppercase tracking-widest px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-mono">
                      {t('liveUpdates')}
                    </span>
                  </h1>
                  <p className="text-xs opacity-75 text-slate-400">{t('subtitle')}</p>
                </div>
              </div>

              {/* View & Accessibility Toggle */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setHighContrast(!highContrast)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 border transition ${
                    highContrast ? 'bg-yellow-400 text-black border-yellow-300' : 'bg-slate-800 text-slate-300 border-slate-700 hover:text-white'
                  }`}
                >
                  <Icon name="eye" className="w-3.5 h-3.5" />
                  {highContrast ? t('standardMode') : t('highContrast')}
                </button>

                <nav className="flex items-center space-x-1 border rounded-xl p-1 border-slate-800 bg-slate-900">
                  <button
                    onClick={() => setCurrentView('map')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                      currentView === 'map' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <Icon name="map" className="w-3.5 h-3.5" />
                    {t('mapRoutes')}
                  </button>

                  <button
                    onClick={() => setCurrentView('profile')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                      currentView === 'profile' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <Icon name="user" className="w-3.5 h-3.5" />
                    {t('profileFavorites')} ({savedRoutes.length})
                  </button>
                </nav>

                {/* Account Controls */}
                <div className="pl-2 border-l border-slate-800">
                  {currentUser.isLoggedIn ? (
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-blue-600/30 border border-blue-500 text-blue-400 flex items-center justify-center text-xs font-bold">
                        {currentUser.displayName ? currentUser.displayName[0].toUpperCase() : 'U'}
                      </div>
                      <div className="hidden sm:block text-left text-[11px]">
                        <p className="font-bold text-white leading-none">{currentUser.displayName}</p>
                        <p className="text-slate-400 leading-none text-[10px] mt-0.5">{currentUser.email}</p>
                      </div>
                      <button
                        onClick={handleSignOut}
                        className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white text-xs font-semibold border border-slate-700 transition"
                      >
                        {t('signOut')}
                      </button>
                    </div>
                  ) : (
                    <button
                      onClick={() => { setAuthMode('login'); setAuthNotice(''); setIsAuthModalOpen(true); }}
                      className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow transition flex items-center gap-1.5"
                    >
                      <Icon name="log-in" className="w-3.5 h-3.5" />
                      {t('signInRegister')}
                    </button>
                  )}
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">

            {serverOffline && (
              <div role="alert" className="p-4 rounded-2xl border border-red-800 bg-red-950/40 text-xs text-red-200 flex flex-wrap items-center gap-3">
                <Icon name="wifi-off" className="w-4 h-4 text-red-400" />
                <span className="flex-1 min-w-[200px]">{t('serverOffline')}</span>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold"
                >
                  {t('serverRetry')}
                </button>
              </div>
            )}

            {/* VIEW 1: PROFILE & SAVED FAVORITES */}
            {currentView === 'profile' && (
              <div className="max-w-4xl mx-auto space-y-6">

                {/* Profile Overview */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center space-x-4">
                    <div className="w-14 h-14 rounded-full bg-blue-600/20 border-2 border-blue-500 flex items-center justify-center text-blue-400 text-xl font-bold">
                      {currentUser.isLoggedIn ? currentUser.displayName[0].toUpperCase() : 'G'}
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white">
                        {currentUser.isLoggedIn ? t('profileSuffix', { name: currentUser.displayName }) : t('guestProfile')}
                      </h2>
                      <p className="text-xs text-slate-400">
                        {currentUser.isLoggedIn ? currentUser.email : t('demoMode')}
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-4 text-center">
                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-800">
                      <p className="text-xs text-slate-400">{t('totalRides')}</p>
                      <p className="text-base font-bold text-white">{achievementStats.rides}</p>
                    </div>
                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-800">
                      <p className="text-xs text-slate-400">Carbon saved (est.)</p>
                      <p className="text-base font-bold text-emerald-400">{ecoMetrics.co2SavedKg === null ? 'Not estimated' : 'About ' + formatCarbon(Math.max(0, ecoMetrics.co2SavedKg), units)}</p>
                    </div>
                  </div>
                </div>

                <section aria-labelledby="carbon-summary-title" className="p-5 rounded-2xl border border-slate-800 bg-slate-950/80 space-y-3 text-xs text-slate-300">
                  <EcoInfo title="Your greener trips" headingId="carbon-summary-title" label="About your saved carbon estimates">
                    <p>Little trips, lasting progress. 🌱 Here's every ride where you let the train do the driving, and the carbon you saved along the way.</p>
                    <details><summary className="cursor-pointer text-blue-300">How we calculate this</summary><div className="mt-3"><EcoMethodNotes /></div></details>
                  </EcoInfo>
                  <p>We could estimate carbon for {carbonSummary.estimatedJourneys} of your {achievementStats.rides} trips. {achievementStats.rides === 1 ? 'It counts' : 'All ' + achievementStats.rides + ' count'} toward your badges.</p>
                  <div role="group" aria-label="Units" className="flex items-center gap-2">
                    <span className="text-slate-400">Units:</span>
                    {[['us', 'Miles & lb'], ['metric', 'Kilometers & kg']].map(([value, text]) => (
                      <button key={value} type="button" aria-pressed={units === value} onClick={() => chooseUnits(value)}
                        className={'px-2.5 py-1 rounded-lg border font-semibold ' + (units === value ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:text-white')}>{text}</button>
                    ))}
                  </div>
                                    <details><summary className="cursor-pointer text-blue-300">Your trip history</summary>
                    <p className="mt-2">Your latest 20 completed trips. Earlier trips are still saved.</p>
                    <ul className="space-y-3 mt-3">{journeyProgress.trips.slice(-20).reverse().map(trip => <li key={trip.id} className="p-3 rounded border border-slate-700">
                      <p>{stationsData[stationId(trip.origin)]?.name || trip.origin} → {stationsData[stationId(trip.destination)]?.name || trip.destination} · {new Date(trip.completedAt).toLocaleString()}</p>
                      {MetroCarbon.validSnapshot(trip.carbon) ? <div>
                        <p>{carbonSentence(trip.carbon.estimatedSavingsKgCO2e, units)} · {formatDistance(trip.carbon.transitDistanceKm, units)} by subway</p>
                        <div className="my-2"><EcoBadge score={MetroEcoScore.fromSnapshot(trip.carbon)?.value} /></div>
                        <details><summary className="cursor-pointer text-blue-300" aria-label="About this saved trip’s estimate">ⓘ About this estimate</summary><p className="mt-2">Compared with one person driving {formatDistance(trip.carbon.drivingDistanceKm, units)} between the same stations. 🌱</p><details className="mt-2"><summary className="cursor-pointer text-blue-300">Technical details</summary><p className="mt-2">Distance source: {trip.carbon.distanceSource}. Model: {trip.carbon.methodVersion}; factor data: {trip.carbon.factorDataYear}.</p><p>{trip.carbon.ecoScore ? 'Score saved when this trip was completed.' : 'Score derived from the saved estimate; the original trip record is unchanged.'}</p></details></details>
                      </div> : <p>No carbon estimate for this trip. It still counts toward your badges.</p>}
                    </li>)}</ul>
                  </details>

                </section>

                {/* Journey Achievements */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        <Icon name="trophy" className="w-5 h-5 text-amber-400" />
                        {t('achievementsTitle')}
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        {t('achievementProgress', {
                          unlocked: Object.keys(journeyProgress.unlocked).length,
                          total: globalThis.MetroAchievements.definitions.length
                        })}
                      </p>
                    </div>
                    <div className="w-32 h-2 rounded-full bg-slate-800 overflow-hidden">
                      <div
                        className="h-full rounded-full bg-gradient-to-r from-blue-500 to-emerald-400"
                        style={{
                          width: `${(
                            Object.keys(journeyProgress.unlocked).length /
                            globalThis.MetroAchievements.definitions.length
                          ) * 100}%`
                        }}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    {globalThis.MetroAchievements.definitions.map((definition) => {
                      const currentValue = achievementStats[definition.metric] || 0;
                      const unlockedAt = journeyProgress.unlocked[definition.id];
                      const progress = Math.min(100, (currentValue / definition.target) * 100);
                      return (
                        <div
                          key={definition.id}
                          className={`p-3 rounded-xl border ${
                            unlockedAt
                              ? 'bg-amber-500/10 border-amber-500/40'
                              : 'bg-slate-900 border-slate-800'
                          }`}
                        >
                          <div className="flex items-start gap-3">
                            <span className={`text-2xl ${unlockedAt ? '' : 'grayscale opacity-50'}`}>
                              {definition.icon}
                            </span>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center justify-between gap-2">
                                <p className={`font-bold ${unlockedAt ? 'text-amber-300' : 'text-slate-300'}`}>
                                  {achievementCopy(definition, 'name')}
                                </p>
                                <span className="text-[10px] text-slate-500 font-mono">
                                  {Math.min(currentValue, definition.target)}/{definition.target}
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-0.5">
                                {achievementCopy(definition, 'description')}
                              </p>
                              <div className="h-1.5 mt-2 rounded-full bg-slate-800 overflow-hidden">
                                <div
                                  className={`h-full rounded-full ${unlockedAt ? 'bg-amber-400' : 'bg-blue-500'}`}
                                  style={{ width: `${progress}%` }}
                                />
                              </div>
                              {unlockedAt && (
                                <p className="text-[10px] text-amber-500/80 mt-1">
                                  {new Date(unlockedAt).toLocaleDateString(lang)}
                                </p>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Saved Favorite Routes */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        <Icon name="bookmark" className="w-5 h-5 text-blue-400" />
                        {t('savedRoutesTitle')}
                      </h2>
                      <p className="text-xs text-slate-400">{t('savedRoutesDesc')}</p>
                    </div>
                    <span className="text-xs font-mono px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300">
                      {t('savedCount', { count: savedRoutes.length })}
                    </span>
                  </div>

                  {savedRoutes.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-xs">
                      <Icon name="bookmark" className="w-8 h-8 mx-auto mb-2 opacity-50" />
                      {t('noSavedRoutes')}
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {savedRoutes.map(fav => (
                        <div key={fav.id} className="p-4 rounded-xl border border-slate-800 bg-slate-900/80 flex flex-wrap items-center justify-between gap-4">
                          {editingId === fav.id ? (
                            <div className="flex items-center gap-2 flex-1">
                              <input 
                                type="text"
                                value={editNameText}
                                onChange={(e) => setEditNameText(e.target.value)}
                                className="p-2 rounded-lg bg-slate-950 border border-blue-500 text-white text-xs flex-1 focus:outline-none"
