                                placeholder={t('routeNamePlaceholder')}
                              />
                              <button 
                                onClick={() => handleSaveEdit(fav.id)}
                                className="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                              >
                                {t('save')}
                              </button>
                            </div>
                          ) : (
                            <div className="space-y-1">
                              <p className="font-bold text-sm text-slate-100 flex items-center gap-2">
                                <span>{fav.nickname}</span>
                                <button onClick={() => handleStartEdit(fav)} className="text-slate-400 hover:text-blue-400 transition" title={t('renameRoute')}>
                                  <Icon name="pencil" className="w-3.5 h-3.5" />
                                </button>
                              </p>
                              <p className="text-xs text-slate-400">
                                {fav.originName} ➔ {fav.destName} • {fav.duration} mins
                              </p>
                              <div className="flex items-center gap-1.5 mt-1">
                                {fav.lines.map((l, i) => (
                                  <LineBadge key={i} line={l} size="w-5 h-5 text-[10px]" />
                                ))}
                              </div>
                            </div>
                          )}

                          <div className="flex items-center gap-2">
                            <button 
                              onClick={() => handleLoadRoute(fav)}
                              className="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center gap-1.5 transition shadow"
                            >
                              <Icon name="navigation" className="w-3.5 h-3.5" /> {t('showOnMap')}
                            </button>
                            <button 
                              onClick={() => handleDeleteRoute(fav.id)}
                              className="p-2 rounded-lg bg-slate-800 hover:bg-red-600 text-slate-400 hover:text-white transition"
                              title={t('deleteRoute')}
                            >
                              <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Interface Language */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <div>
                    <h2 className="text-base font-bold text-white flex items-center gap-2">
                      <Icon name="languages" className="w-5 h-5 text-blue-400" />
                      {t('languageTitle')}
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">{t('languageDesc')}</p>
                  </div>

                  <div className="flex flex-col sm:flex-row sm:items-end gap-3">
                    <div className="flex-1">
                      <label htmlFor="languageSelect" className="block text-slate-300 font-semibold mb-1 text-xs">
                        {t('interfaceLanguage')}
                      </label>
                      <select
                        id="languageSelect"
                        value={draftLanguage}
                        onChange={(event) => setDraftLanguage(event.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white font-medium text-xs focus:outline-none focus:border-blue-500"
                      >
                        {LANGUAGE_OPTIONS.map((option) => (
                          <option key={option.code} value={option.code}>{option.label}</option>
                        ))}
                      </select>
                    </div>
                    <button
                      type="button"
                      onClick={handleSaveLanguage}
                      disabled={draftLanguage === lang}
                      className="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold text-xs transition"
                    >
                      {t('saveLanguage')}
                    </button>
                  </div>
                </div>

                {/* Commute Preferences */}
                <div className="p-6 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                  <h2 className="text-base font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                    <Icon name="sliders" className="w-5 h-5 text-blue-400" />
                    {t('commuterPreferences')}
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <label className="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-900 cursor-pointer">
                      <span className="text-slate-300 font-semibold">{t('preferStepFree')}</span>
                      <input 
                        type="checkbox" 
                        checked={preferences.preferStepFree}
                        onChange={(e) => setPreferences({ ...preferences, preferStepFree: e.target.checked })}
                        className="w-4 h-4 rounded text-blue-600"
                      />
                    </label>

                    <label className="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-900 cursor-pointer">
                      <span className="text-slate-300 font-semibold">{t('outageNotifications')}</span>
                      <input 
                        type="checkbox" 
                        checked={preferences.notifyOutages}
                        onChange={(e) => setPreferences({ ...preferences, notifyOutages: e.target.checked })}
                        className="w-4 h-4 rounded text-blue-600"
                      />
                    </label>
                  </div>
                </div>

              </div>
            )}

            {/* VIEW 2: INTERACTIVE MAP & ROUTE PLANNER */}
            {currentView === 'map' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                {/* Left Side: Route Controls */}
                <div className="lg:col-span-5 space-y-4">

                  {/* Origin / Destination Selector */}
                  <div className="p-5 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-4">
                    <h2 className="text-base font-bold flex items-center gap-2 text-white">
                      <Icon name="navigation" className="w-5 h-5 text-blue-400" />
                      {t('routeFinder')}
                    </h2>

                    <div className="space-y-3 text-xs">
                      <StationSearch
                        id="originStationSearch"
                        label={t('startStation')}
                        value={origin}
                        stations={stationOptions}
                        onChange={value => changeStation('origin', value)}
                        placeholder={t('searchStart')}
                        t={t}
                      />

                      <StationSearch
                        id="destinationStationSearch"
                        label={t('destinationStation')}
                        value={destination}
                        stations={stationOptions}
                        onChange={value => changeStation('destination', value)}
                        placeholder={t('searchDestination')}
                        t={t}
                      />
                      <label className="flex items-start gap-2 text-xs text-slate-300 cursor-pointer select-none">
                        <input
                          type="checkbox"
                          checked={accessibleOnly}
                          onChange={(e) => setAccessibleOnly(e.target.checked)}
                          className="mt-0.5"
                        />
                        <span>
                          <span className="font-semibold">♿ {t('accessibleOnly')}</span>
                          <br />
                          <span className="text-[10px] text-slate-500">{t('accessibleHint')}</span>
                        </span>
                      </label>
                    </div>
                  </div>

                  <span role="status" aria-live="polite" className="sr-only">{selectedEcoScore ? 'Eco score ' + Math.round(selectedEcoScore.value) : ''}</span>
                  {ecoSheetOpen && (
                    <EcoSheet onClose={closeEcoSheet}>
                      {/* Two short lines; the score rule and humor live under How we calculate this. */}
                      <p className="font-semibold text-white">{origin === destination ? 'Choose two different stations to see your Eco score.' :
                        carbonEstimate.status === 'estimated' ? carbonSentence(carbonEstimate.estimatedSavingsKgCO2e, units) + (selectedEcoScore ? ' · Eco score ' + Math.round(selectedEcoScore.value) : '') :
                        distanceMode === 'manual' ? 'Add your trip distances under How we calculate this to see a score.' :
                        transitError || (roadIsCurrent && roadState.status === 'error') ? "We couldn't get the distances for this trip." : transitState && selectedItinerary && !currentItinerary ? 'No carbon estimate for this route yet.' : 'Working out your carbon savings…'}</p>
                      {carbonEstimate.status === 'estimated' && <p>{carbonEstimate.estimatedSavingsKgCO2e > 0 ? "That's like skipping " + phoneCharges(carbonEstimate.estimatedSavingsKgCO2e) + ' phone charges.' : 'Every ride still counts toward your badges.'}</p>}
                      {lowestCarbonIsDistinct && routeCards.find(r => r.ecoRecommended) && <p className="text-slate-400">Lowest carbon option: {routeCards.find(r => r.ecoRecommended).title.replace('GTFS', 'subway')}.</p>}
                      {ecoUnavailable && <button type="button" className="min-h-[44px] px-4 rounded-lg border border-slate-600 text-blue-300 font-semibold hover:bg-slate-800" onClick={() => {
                        roadClient.clearCache(); setRoadState({ status: 'loading' }); setRoadRetry(n => n + 1);
                        if (transitError) setTransitRetry(n => n + 1);
                      }}>Try again</button>}
                      <details><summary className="cursor-pointer text-blue-300 py-2">How we calculate this</summary>
                        <div className="space-y-3 mt-3">                      <EcoMethodNotes />
                      <h3 className="font-semibold text-white">This trip</h3>
                      <p>{stationsData[origin]?.name} → {stationsData[destination]?.name}</p>
                      <p>Subway: {origin === destination ? 'Same station' : currentItinerary ? formatDistance(currentItinerary.transitDistanceKm, units) : transitError || (transitState && selectedItinerary ? 'Not available' : 'Loading…')} · By car: {origin === destination ? 'Same station' : roadIsCurrent && roadState.status === 'ready' ? formatDistance(roadState.data.drivingDistanceKm, units) : roadIsCurrent && roadState.status === 'error' ? 'Unavailable' : 'Calculating…'}</p>
                      {carbonEstimate.status === 'estimated' ? <p>By car: about {formatCarbon(carbonEstimate.carEmissionsKgCO2e, units)} carbon · by subway: about {formatCarbon(carbonEstimate.transitEmissionsKgCO2e, units)}.</p> : <p>{carbonEstimate.reason}</p>}
                      <p className="text-slate-500">Driving distances come from {globalThis.MetroDistanceConfig?.roadEndpoint ? 'a road-routing service' : 'OSRM, a public road-routing demo'}, which can sometimes be unavailable.</p>
                      {showManualDistance && <label className="block">Distance calculation (developer)
                        <select aria-label="Distance calculation mode" value={distanceMode} onChange={e => setDistanceMode(e.target.value)} className="block w-full p-2 mt-1 bg-slate-950 border border-slate-700 rounded">
                          <option value="automatic">Automatic</option><option value="manual">Enter distances yourself</option>
                        </select>
                      </label>}
                      {distanceMode === 'manual' && <div className="space-y-3">
                    <p>Backup only: enter verified distances and source for the selected itinerary.</p>
                    <label className="block">Distance unit
                      <select aria-label="CO2 distance unit" value={carbonInput.unit} onChange={e => { setCarbonDraft({ ...carbonInput, routeKey: carbonRouteKey, unit: e.target.value, drivingDistance: '', transitDistance: '' }); }} className="block w-full p-2 mt-1 bg-slate-900 border border-slate-700 rounded">
                        <option value="km">Kilometers (km)</option><option value="mi">Miles (mi)</option>
                      </select>
                    </label>
                    <div className="grid grid-cols-2 gap-3">
                      <label>Driving route distance ({carbonInput.unit})<input aria-label="Driving route distance" type="number" min="0" step="any" value={carbonInput.drivingDistance} onChange={e => updateCarbonInput('drivingDistance', e.target.value)} className="block w-full p-2 mt-1 bg-slate-900 border border-slate-700 rounded" /></label>
                      <label>Subway distance, excluding walks ({carbonInput.unit})<input aria-label="Subway route distance" type="number" min="0" step="any" value={carbonInput.transitDistance} onChange={e => updateCarbonInput('transitDistance', e.target.value)} className="block w-full p-2 mt-1 bg-slate-900 border border-slate-700 rounded" /></label>
                    </div>
                    <label className="block">Distance source (route planner / map and itinerary)
                      <input aria-label="Route distance source" maxLength="200" placeholder="e.g. route planner name and selected subway line" value={carbonInput.distanceSource} onChange={e => updateCarbonInput('distanceSource', e.target.value)} className="block w-full p-2 mt-1 bg-slate-900 border border-slate-700 rounded" />
                    </label>
                    </div>}

</div>
                      </details>
                    </EcoSheet>
                  )}
                  {/* Calculated Route Cards */}
                  <div className="space-y-3">
                    {activeJourney && (
                      <div className="p-4 rounded-2xl border border-emerald-700/70 bg-emerald-950/30 space-y-3">
                        <div>
                          <p className="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">
                            {t('journeyInProgress')}
                          </p>
                          <p className="text-sm font-bold text-white mt-1">
                            {stationsData[activeJourney.origin]?.name || activeJourney.origin}
                            <span className="text-slate-500 mx-2">→</span>
                            {stationsData[activeJourney.destination]?.name || activeJourney.destination}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={handleCompleteJourney}
                            className="flex-1 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                          >
                            {t('completeJourney')}
                          </button>
                          <button
                            type="button"
                            onClick={handleCancelJourney}
                            className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs"
                          >
                            {t('cancelJourney')}
                          </button>
                        </div>
                      </div>
                    )}
                    {routeLoading && (
                      <div className="p-4 rounded-2xl border border-blue-900 bg-blue-950/30 text-xs text-blue-300 flex items-center gap-2">
                        <Icon name="loader-circle" className="w-4 h-4" />
                        {t('calculatingRoutes', { count: stationOptions.length })}
                      </div>
                    )}
                    {routeError && !routeLoading && (
                      <div className="p-4 rounded-2xl border border-amber-900 bg-amber-950/30 text-xs text-amber-300">
                        {t(routeError)}
                      </div>
                    )}
                    {routeResults.length > 0 && serviceDay && (
                      <p className="text-[11px] text-slate-500">
                        {t('scheduleNote', { day: t('serviceDay_' + serviceDay) })}
                      </p>
                    )}
                    {routeCards.map((opt) => (
                      <div
                        key={opt.id}
                        onClick={() => setSelectedRouteOption(opt.id)}
                        className={`p-4 rounded-2xl border cursor-pointer transition shadow-lg ${
                          selectedRouteOption === opt.id 
                            ? 'border-blue-500 bg-blue-950/30 ring-1 ring-blue-500/50' 
                            : 'border-slate-800 bg-slate-950/60 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-start justify-between mb-2">
                          <div>
                            <h3 className="font-bold text-sm text-white flex items-center gap-2">
                              {opt.id === 0 ? t('fastestRoute') : t('alternativeRoute', { number: opt.id })}
                              {opt.isAda && <span className="text-[10px] text-blue-400 bg-blue-950 px-1.5 py-0.5 rounded border border-blue-800">♿ {t('accessible')}</span>}
                            </h3>
                            <p className="text-xs text-slate-400 mt-0.5">
                              {opt.duration} {t('mins')} • {t('transferCount', { count: opt.transfers })}
                            </p>
                          </div>
                          <div className="flex items-center space-x-1.5">
                            {opt.lines.map((l, idx) => (
                              <LineBadge 
                                key={idx} 
                                line={l} 
                                isExpress={opt.isExpress ? opt.isExpress[idx] : false} 
                                size="w-6 h-6 text-xs" 
                              />
                            ))}
                          </div>
                        </div>

                        {/* Step Details */}
                        <div className="space-y-1.5 my-3 pl-2 border-l-2 border-slate-800 text-xs text-slate-300">
                          {formatRouteSteps(opt).map((st, i) => (
                            <p key={i} className="flex items-start gap-1.5">
                              <span className="text-slate-500">•</span> {st}
                            </p>
                          ))}
                        </div>

                        {opt.alerts?.length > 0 && (
                          <div className="mb-3 p-2.5 rounded-lg border border-amber-800/70 bg-amber-950/30 text-[11px] text-amber-200 space-y-1">
                            <p className="font-bold flex items-center gap-1">
                              <Icon name="triangle-alert" className="w-3.5 h-3.5" />
                              {t('serviceAlerts')}
                            </p>
                            {opt.alerts.map((alert) => (
                              <p key={alert.line}>
                                <span className="font-bold">{alert.line}:</span> {alert.items[0].headline}
                                {alert.items.length > 1 ? ` (+${alert.items.length - 1})` : ''}
                              </p>
                            ))}
                          </div>
                        )}

                        {/* Route details (expandable) */}
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            setExpandedRouteId(expandedRouteId === opt.id ? null : opt.id);
                          }}
                          aria-expanded={expandedRouteId === opt.id}
                          className="w-full mb-3 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-[11px] font-semibold text-slate-200 flex items-center justify-center gap-1.5"
                        >
                          <Icon name={expandedRouteId === opt.id ? 'chevron-up' : 'chevron-down'} className="w-3.5 h-3.5" />
                          {expandedRouteId === opt.id ? t('hideDetails') : t('routeDetails')}
                        </button>
                        {expandedRouteId === opt.id && (
                          <div onClick={(e) => e.stopPropagation()}>{renderRouteDetails(opt)}</div>
                        )}

                        {/* Actions */}
                        <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleStartJourney(opt.id);
                            }}
                            disabled={Boolean(activeJourney)}
                            className="text-[11px] text-emerald-400 hover:underline disabled:text-slate-600 disabled:no-underline flex items-center gap-1 font-semibold"
                          >
                            <Icon name="route" className="w-3.5 h-3.5" /> {t('startJourney')}
                          </button>

                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleSaveRoute(opt);
                            }}
                            className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center gap-1.5 transition shadow"
                          >
                            <Icon name="bookmark" className="w-3.5 h-3.5" />
                            {t('bookmarkRoute')}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                    {/* Eco entry point: one small icon under the routes, shown only once routes are listed. No text, so it never competes with navigation. */}
                    {routeCards.length > 0 && origin !== destination && (
                      <button type="button" onClick={openEcoSheet} aria-haspopup="dialog"
                        aria-label={selectedEcoScore ? 'Eco score ' + Math.round(selectedEcoScore.value) + ': ' + carbonSentence(carbonEstimate.estimatedSavingsKgCO2e, units) + '. Show details' : 'Eco score details'}
                        title="Eco score"
                        className="ml-1 min-w-[44px] min-h-[44px] px-2 inline-flex items-center justify-center gap-1 rounded-full text-slate-400 hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-400">
                        <span aria-hidden="true" className="text-base leading-none">🌱</span>
                        <span aria-hidden="true" className="w-4 h-4 rounded-full border border-slate-600 text-[10px] font-bold leading-[14px] text-center text-blue-300">i</span>
                      </button>
                    )}

                  {/* Places Near Destination */}
                  <div className="p-5 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                    <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                      <Icon name="map-pin" className="w-4 h-4 text-red-400" />
                      {t('placesNear', { station: stationsData[destination]?.name || '' })}
                    </h2>

                    <div className="space-y-2">
                      {(YELP_VENUES_DATABASE[destination] || YELP_VENUES_DATABASE['127']).map(v => (
                        <div key={v.id} className="p-3 rounded-xl border border-slate-800 bg-slate-900/60 flex items-center justify-between gap-3 text-xs">
                          <div className="flex items-center space-x-3">
                            <span className="text-xl">{v.image}</span>
                            <div>
                              <p className="font-bold text-white">{v.name}</p>
                              <p className="text-[11px] text-slate-400">{v.text}</p>
                            </div>
                          </div>
                          <div className="text-right whitespace-nowrap">
                            <p className="font-bold text-amber-400">★ {v.rating}</p>
                            <p className="text-[10px] text-slate-500">{v.distance}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* Right Side: Map & Live Service Updates */}
                <div className="lg:col-span-7 space-y-4">

                  {/* Interactive Map Header */}
                  <div className="p-4 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <Icon name="map" className="w-4 h-4 text-blue-400" />
                        {t('interactiveMap')}
                      </h2>

                      <div className="flex items-center gap-3">
                        {!useAltMap && routeResults.length > 0 && (
                          <button
                            type="button"
                            onClick={() => {
                              setShowAllLines(!showAllLines);
                              setActiveLine(null);
                            }}
                            aria-pressed={showAllLines}
                            className={`px-2.5 py-1 rounded-lg border text-[11px] font-semibold flex items-center gap-1.5 transition ${
                              showAllLines
                                ? 'bg-blue-600 border-blue-400 text-white'
                                : 'bg-slate-900 border-slate-700 text-slate-300 hover:text-white'
                            }`}
                          >
                            <Icon name="layers" className="w-3.5 h-3.5" />
                            {showAllLines ? t('showRouteOnly') : t('showAllLines')}
                          </button>
                        )}
                        <button
                          onClick={() => setUseAltMap(!useAltMap)}
                          className="text-xs text-slate-400 hover:text-white underline flex items-center gap-1"
                        >
                          <Icon name="list" className="w-3.5 h-3.5" />
                          {useAltMap ? t('mapView') : t('stationListView')}
                        </button>
                      </div>
                    </div>

                    {!useAltMap ? (
                      <div className="space-y-2">
                        <div className="relative">
                          <div ref={mapContainerRef} className="h-[440px] w-full rounded-xl border border-slate-800 shadow-inner"></div>
                          {effectiveActiveLine && activeLineInfo && (
                            <div className="absolute top-3 right-3 z-[1000] w-60 max-h-[400px] flex flex-col rounded-xl border border-slate-700 bg-slate-950/95 shadow-2xl text-xs">
                              <div className="flex items-center gap-2 p-3 border-b border-slate-800">
                                <LineBadge line={activeLineInfo.id} size="w-6 h-6 text-xs" />
                                <div className="flex-1">
                                  <p className="font-bold text-white">{t('lineName', { line: activeLineInfo.id })}</p>
                                  <p className="text-[10px] text-slate-400">{t('lineStations', { count: activeLineInfo.stations.length })}</p>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => setActiveLine(null)}
                                  aria-label={t('closePanel')}
                                  className="p-1 rounded hover:bg-slate-800 text-slate-400"
                                >
                                  <Icon name="x" className="w-4 h-4" />
                                </button>
                              </div>
                              <div className="overflow-y-auto p-2 space-y-2">
                                {activeLineInfo.sections.map((section, sectionIndex) => (
                                  <div key={sectionIndex}>
                                    {section.branch !== null && (
                                      <p className="px-2 pb-1 text-[10px] uppercase tracking-wider text-slate-500">
                                        {section.branch ? t('lineBranch', { station: section.branch }) : t('lineBranchGeneric')}
                                      </p>
                                    )}
                                    <ol className="space-y-0.5">
                                      {section.stations.map((station) => (
                                        <li key={station.id}>
                                          <button
                                            type="button"
                                            onClick={() => focusLineStation(station)}
                                            className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-slate-800 flex items-center gap-2"
                                          >
                                            <span className="w-2.5 h-2.5 rounded-full border-2 flex-shrink-0" style={{ borderColor: activeLineInfo.color }} />
                                            <span className="flex-1 text-slate-200">{station.name}</span>
                                            <span className="flex gap-0.5">
                                              {station.otherLines.slice(0, 5).map((l) => (
                                                <LineBadge key={l} line={l} size="w-4 h-4 text-[9px]" />
                                              ))}
                                            </span>
                                          </button>
                                        </li>
                                      ))}
                                    </ol>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                        <p className="text-[11px] text-slate-500">{basemapFailed ? t('basemapUnavailable') : showNetwork ? t('lineHint') : t('routeOnlyHint')}</p>
                      </div>
                    ) : (
                      <div className="p-4 rounded-xl border border-slate-800 bg-slate-900 space-y-2 text-xs">
                        <p className="font-bold text-slate-300">{t('stationListView')}:</p>
                        {stationOptions.map(s => (
                          <div key={`alt-${s.id}`} className="p-2 border-b border-slate-800 flex justify-between items-center">
                            <span>{s.name}{s.borough ? ` (${s.borough})` : ''}</span>
                            <div className="flex gap-1 items-center">
                              {s.lines.map((l, i) => (
                                <LineBadge key={i} line={l} size="w-4 h-4 text-[9px]" />
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Live Service Alerts & Elevator Monitor */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                    {/* Live GTFS-Realtime train updates */}
                    <div className="p-4 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                      <div className="flex items-center justify-between gap-2">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                          <Icon name="radio" className="w-4 h-4" />
                          {t('liveTrainUpdates')}
                        </h3>
                        <span className="text-[10px] text-emerald-400 font-mono">
                          {t('trips', { count: liveTrainCount })}
                        </span>
                      </div>

                      <div className="space-y-2 text-xs">
                        {liveDataError && (
                          <p className="text-[11px] text-amber-400">{t(liveDataError)}</p>
                        )}
                        {!liveDataError && liveTrains.length === 0 && (
                          <p className="text-[11px] text-slate-500">{t('waitingLive')}</p>
                        )}
                        {liveTrains.slice(0, 4).map((train, index) => (
                          <div key={`${train.tripId || train.routeId}-${index}`} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                            <div className="flex items-center gap-2 font-bold text-white">
                              <LineBadge line={displayRouteId(train.routeId)} size="w-5 h-5 text-[10px]" />
                              <span>{train.nextStop?.stopName || '—'}</span>
                              <span className="ml-auto text-amber-400 font-mono">
                                {formatEpochTime(train.nextStop?.arrivalTime || train.nextStop?.departureTime)}
                              </span>
                            </div>
                            <p className="text-[10px] text-slate-500 font-mono truncate">
                              {t('trip', { id: train.tripId || '—' })}
                            </p>
                          </div>
                        ))}
                        {liveFetchedAt && (
                          <p className="text-[10px] text-slate-600 text-right">
                            {t('updatedAt', { time: new Date(liveFetchedAt).toLocaleTimeString() })}
                          </p>
                        )}
                      </div>
                    </div>

                    {/* Elevator & Escalator Status */}
                    <div className="p-4 rounded-2xl border border-slate-800 bg-slate-950/80 shadow-2xl space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center gap-1.5">
                        <Icon name="accessibility" className="w-4 h-4" />
                        {t('elevatorUpdates')}
                      </h3>

                      <div className="space-y-2 text-xs">
                        {outageError && (
                          <p className="text-[11px] text-amber-400">{t(outageError)}</p>
                        )}
                        {!outageError && !outagesLoaded && (
                          <p className="text-[11px] text-slate-500">{t('loadingOutages')}</p>
                        )}
                        {!outageError && outagesLoaded && outages.length === 0 && (
                          <p className="text-[11px] text-emerald-400">{t('noOutages')}</p>
                        )}
                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                        {outages.map((out, i) => (
                          <div key={`${out.equipmentId || out.equipment || 'outage'}-${i}`} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-1">
                            <p className="font-bold text-slate-200">
                              {out.stationName || out.station || '—'}
                              {out.lines && <span className="ml-1.5 font-normal text-slate-400">({out.lines})</span>}
                            </p>
                            <p className="text-[10px] text-slate-400">
                              {out.equipmentType || 'Equipment'} {out.equipmentId || ''}{out.serving ? ` · ${out.serving}` : ''}
                            </p>
                            <div className="flex justify-between text-[11px]">
                              <span className="text-red-400 font-semibold">{out.status || out.reason || 'Unavailable'}</span>
                              <span className="text-slate-500">ETA: {out.estimatedReturn || 'Unknown'}</span>
                            </div>
                          </div>
                        ))}
                        </div>
                        {upcomingOutageCount > 0 && (
                          <p className="text-[10px] text-slate-500">{t('upcomingOutages', { count: upcomingOutageCount })}</p>
                        )}
                      </div>
                    </div>

                  </div>

                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
