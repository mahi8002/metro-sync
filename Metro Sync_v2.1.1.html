<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Transit Hub Pro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Persistent journey achievements -->
  <script src="achievements.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Keep all interface and status icons static for glanceable wayfinding. */
    svg,
    [data-lucide],
    .animate-spin,
    .animate-bounce,
    .animate-pulse {
      animation: none !important;
    }
    .leaflet-container {
      background-color: #0f172a !important;
      font-family: inherit;
      z-index: 10;
      border-radius: 0.75rem;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 0.5rem;
    }
    .leaflet-control-zoom a {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }
    /* Official MTA Line Badge Base Styles */
    .mta-badge-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 700;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .mta-badge-diamond {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      border-radius: 2px;
      font-weight: 700;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .mta-badge-diamond-inner {
      transform: rotate(-45deg);
      display: inline-block;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper Component for Lucide Icons
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.lucide) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            nameAttr: 'data-lucide',
            attrs: { class: className }
          });
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center" {...props} />;
    };

    // Official MTA Trunk Line Palette Specs
    const MTA_LINE_COLORS = {
      '1': 'bg-[#EE352E] text-white', '2': 'bg-[#EE352E] text-white', '3': 'bg-[#EE352E] text-white',
      '4': 'bg-[#00933C] text-white', '5': 'bg-[#00933C] text-white', '6': 'bg-[#00933C] text-white',
      'A': 'bg-[#0039A6] text-white', 'C': 'bg-[#0039A6] text-white', 'E': 'bg-[#0039A6] text-white',
      'N': 'bg-[#FCCC0A] text-black font-bold', 'Q': 'bg-[#FCCC0A] text-black font-bold', 'R': 'bg-[#FCCC0A] text-black font-bold', 'W': 'bg-[#FCCC0A] text-black font-bold',
      'B': 'bg-[#FF6319] text-white', 'D': 'bg-[#FF6319] text-white', 'F': 'bg-[#FF6319] text-white', 'M': 'bg-[#FF6319] text-white',
      '7': 'bg-[#B3519E] text-white', 'L': 'bg-[#A7A9AC] text-white', 'G': 'bg-[#6CBE45] text-white', 'J': 'bg-[#996633] text-white', 'Z': 'bg-[#996633] text-white',
      'S': 'bg-[#808183] text-white'
    };

    const HEX_LINE_COLORS = {
      '1': '#EE352E', '2': '#EE352E', '3': '#EE352E',
      '4': '#00933C', '5': '#00933C', '6': '#00933C',
      'A': '#0039A6', 'C': '#0039A6', 'E': '#0039A6',
      'N': '#FCCC0A', 'Q': '#FCCC0A', 'R': '#FCCC0A', 'W': '#FCCC0A',
      'B': '#FF6319', 'D': '#FF6319', 'F': '#FF6319', 'M': '#FF6319',
      '7': '#B3519E', 'L': '#A7A9AC', 'G': '#6CBE45', 'J': '#996633', 'Z': '#996633',
      'S': '#808183'
    };

    const displayRouteId = (routeId) => {
      if (['FS', 'GS', 'H'].includes(routeId)) return 'S';
      if (routeId === 'SI') return 'SIR';
      return String(routeId || '?').replace(/X$/, '');
    };

    const formatEpochTime = (epochSeconds) => {
      if (!epochSeconds) return '--:--';
      return new Date(epochSeconds * 1000).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    // VS Code Live Server normally serves this file on port 5500 while the
    // Express API runs on port 5000. Detect that local-development setup so
    // API calls do not get sent to Live Server and return 404.
    const API_BASE_URL = (() => {
      const localHosts = ['localhost', '127.0.0.1', '::1', '[::1]'];
      const isLocal = localHosts.includes(window.location.hostname);
      if (window.location.protocol === 'file:') return 'http://localhost:5000';
      if (isLocal && window.location.port !== '5000') return 'http://localhost:5000';
      return '';
    })();
    const apiUrl = (path) => `${API_BASE_URL}${path}`;

    // MTA Line Badge Component (Supports Circle vs Express Diamond Badges)
    const LineBadge = ({ line, isExpress = false, size = "w-5 h-5 text-[10px]" }) => {
      const colorClass = MTA_LINE_COLORS[line] || 'bg-slate-700 text-white';
      
      if (isExpress) {
        return (
          <span 
            className={`mta-badge-diamond ${size} ${colorClass}`}
            aria-label={`${line} Express Line`}
          >
            <span className="mta-badge-diamond-inner">{line}</span>
          </span>
        );
      }

      return (
        <span 
          className={`mta-badge-circle ${size} ${colorClass}`}
          aria-label={`${line} Local Line`}
        >
          {line}
        </span>
      );
    };

    const normalizeStationSearch = (value) =>
      String(value || '')
        .toLowerCase()
        .replace(/\bsquare\b/g, 'sq')
        .replace(/\bstreet\b/g, 'st')
        .replace(/\bavenue\b/g, 'av')
        .replace(/\bcenter\b/g, 'ctr')
        .replace(/\bsaint\b/g, 'st')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');

    const stationSearchScore = (station, query) => {
      const normalizedQuery = normalizeStationSearch(query);
      const stationName = normalizeStationSearch(station.name);
      const stationId = normalizeStationSearch(station.id);
      if (!normalizedQuery) return 0;
      if (stationId === normalizedQuery || stationName === normalizedQuery) return 0;
      if (stationId.startsWith(normalizedQuery)) return 2;
      if (stationName.startsWith(normalizedQuery)) return 4;
      const substringIndex = stationName.indexOf(normalizedQuery);
      if (substringIndex >= 0) return 10 + substringIndex / 1000;

      let queryIndex = 0;
      let gaps = 0;
      let lastMatch = -1;
      for (let index = 0; index < stationName.length; index++) {
        if (stationName[index] !== normalizedQuery[queryIndex]) continue;
        if (lastMatch >= 0) gaps += index - lastMatch - 1;
        lastMatch = index;
        queryIndex++;
        if (queryIndex === normalizedQuery.length) return 30 + gaps;
      }
      return Number.POSITIVE_INFINITY;
    };

    const StationSearch = ({ id, label, value, stations, onChange, placeholder, t }) => {
      const selectedStation = stations.find((station) => station.id === value);
      const [query, setQuery] = useState(selectedStation?.name || '');
      const [isOpen, setIsOpen] = useState(false);
      const [activeIndex, setActiveIndex] = useState(0);
      const blurTimerRef = useRef(null);

      useEffect(() => {
        setQuery(selectedStation?.name || '');
      }, [value, selectedStation?.name]);

      const results = useMemo(() => {
        const showAll =
          normalizeStationSearch(query) ===
          normalizeStationSearch(selectedStation?.name || '');
        const ranked = stations
          .map((station) => ({
            station,
            score: showAll ? 0 : stationSearchScore(station, query)
          }))
          .filter((item) => Number.isFinite(item.score))
          .sort(
            (a, b) =>
              a.score - b.score || a.station.name.localeCompare(b.station.name)
          )
          .slice(0, 12)
          .map((item) => item.station);
        return ranked;
      }, [stations, query, selectedStation?.name]);

      const chooseStation = (station) => {
        onChange(station.id);
        setQuery(station.name);
        setActiveIndex(0);
        setIsOpen(false);
      };

      const handleKeyDown = (event) => {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          setIsOpen(true);
          setActiveIndex((current) => Math.min(current + 1, Math.max(0, results.length - 1)));
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          setActiveIndex((current) => Math.max(current - 1, 0));
        } else if (event.key === 'Enter' && isOpen && results[activeIndex]) {
          event.preventDefault();
          chooseStation(results[activeIndex]);
        } else if (event.key === 'Escape') {
          setIsOpen(false);
          setQuery(selectedStation?.name || '');
        }
      };

      return (
        <div>
          <label htmlFor={id} className="block text-slate-400 font-semibold mb-1">{label}</label>
          <div className="relative">
            <Icon name="search" className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
            <input
              id={id}
              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded={isOpen}
              aria-controls={`${id}-results`}
              autoComplete="off"
              value={query}
              placeholder={placeholder}
              onFocus={() => {
                clearTimeout(blurTimerRef.current);
                setIsOpen(true);
                setActiveIndex(0);
              }}
              onChange={(event) => {
                setQuery(event.target.value);
                setIsOpen(true);
                setActiveIndex(0);
              }}
              onBlur={() => {
                blurTimerRef.current = setTimeout(() => {
                  setIsOpen(false);
                  setQuery(selectedStation?.name || '');
                }, 150);
              }}
              onKeyDown={handleKeyDown}
              className="w-full p-2.5 pl-9 rounded-xl border border-slate-700 bg-slate-900 text-white font-medium focus:outline-none focus:border-blue-500"
            />
            {isOpen && (
              <div
                id={`${id}-results`}
                role="listbox"
                className="absolute z-30 mt-1 w-full max-h-64 overflow-y-auto rounded-xl border border-slate-700 bg-slate-950 shadow-2xl"
              >
                {results.length === 0 ? (
                  <p className="p-3 text-xs text-slate-500">{t('noMatchingStations')}</p>
                ) : results.map((station, index) => (
                  <button
                    key={`${id}-${station.id}`}
                    type="button"
                    role="option"
                    aria-selected={station.id === value}
                    onMouseDown={(event) => event.preventDefault()}
                    onClick={() => chooseStation(station)}
                    onMouseEnter={() => setActiveIndex(index)}
                    className={`w-full text-left px-3 py-2 border-b last:border-b-0 border-slate-800 ${
                      index === activeIndex ? 'bg-blue-600/25 text-white' : 'text-slate-300 hover:bg-slate-900'
                    }`}
                  >
                    <span className="block text-xs font-semibold">{station.name}</span>
                    <span className="block text-[10px] text-slate-500 font-mono">
                      {station.lines?.join(' · ') || station.id}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // Initial station data keeps the UI usable while /api/v1/stations loads.
    // IDs below are GTFS parent-station IDs, not direction-specific platforms.
    const STATIONS_FALLBACK = {

    // Elevator & Escalator Status Demo Data
    const INITIAL_ELEVATOR_OUTAGES = [
      { stationId: 'GCT', equipment: 'Elevator EL204 (42nd St Entrance)', status: 'Under Repair', estimatedReturn: 'Today at 4:00 PM' },
      { stationId: 'PENN', equipment: 'Escalator ES102 (7th Ave Concourse)', status: 'Inspecting', estimatedReturn: 'Today at 2:30 PM' }
    ];

    // --- De-coupled Offline Assistant Engine Logic ---
    const runOfflineAssistantQuery = (query, currentOrigin, currentDest, stationsData, currentRoutes) => {
      const q = query.toLowerCase().trim();
      const originSt = stationsData[currentOrigin];
      const destSt = stationsData[currentDest];

      if (q.includes("step-free") || q.includes("elevator") || q.includes("wheelchair") || q.includes("ada") || q.includes("accessible")) {
        const origAda = originSt?.ada ? "step-free accessible ♿" : "NOT step-free ⚠️";
        const destAda = destSt?.ada ? "step-free accessible ♿" : "NOT step-free ⚠️";
        return `Accessibility Check: ${originSt?.name || 'Origin'} is ${origAda}. ${destSt?.name || 'Destination'} is ${destAda}. For active equipment outages, check the Elevator Updates card.`;
      }
      if (q.includes("delay") || q.includes("alert") || q.includes("status") || q.includes("service") || q.includes("train")) {
        return `Live Transit Alerts: Line 7 Express has signal delays at Queensboro Plaza. Line L has single-track maintenance near Union Sq. Line A Express is operating express in Manhattan.`;
      }
      if (q.includes("food") || q.includes("coffee") || q.includes("pizza") || q.includes("eat") || q.includes("near") || q.includes("place")) {
        const venues = YELP_VENUES_DATABASE[currentDest] || YELP_VENUES_DATABASE['127'];
        const top = venues[0];
        return `Top recommendation near ${destSt?.name || 'destination'}: ${top.name} (${top.image} ${top.price}, ${top.distance}) - ${top.text}`;
      }
      if (q.includes("transfer") || q.includes("route") || q.includes("fast") || q.includes("how to get")) {
        const fastest = currentRoutes?.[0];
        if (fastest) {
          return `Commute Guidance: ${originSt?.name} to ${destSt?.name} takes about ${fastest.duration} minutes on ${fastest.lines.join('/')}, including about ${fastest.walkingMinutes} minutes of station walking.`;
        }
        return `Commute Guidance: Select an origin and destination to calculate a route from the live station graph.`;
      }
      return `Subterranean Assistant (Offline Mode): I can answer questions instantly about elevator accessibility, current subway line delays, fastest transfer options, or nearby food at ${destSt?.name}.`;
    };

    const LANGUAGE_OPTIONS = [
